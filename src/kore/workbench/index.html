<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kore 工作台</title>
<style>
  /* ── design tokens ──────────────────────────────────
     2026-09-25 换肤：深色运维面板 → 浅色克制产品界面（参考 DeepSeek Harness 桌面版
     nightly 的截图：白卡片 + hairline + 极淡阴影 + 大留白 + 黑色主按钮）。
     颜色字面量只允许出现在这个块里，规则一律用变量。 */
  :root{
    /* 表面 */
    --bg:#f5f5f7; --panel:#ffffff; --panel2:#fafafa;
    --line:#e8e8ea; --line2:#f1f1f3; --edge:#c7c7cc; --thumb:#d2d2d7;
    /* 文字 */
    --text:#1d1d1f; --dim:#6e6e73; --faint:#8e8e93;
    /* 黑色主按钮（参考图「登录」/「开始设置」/「继续」/「+ 添加插件」） */
    --btn:#111111; --btn-text:#ffffff; --btn-hover:#000000;
    /* 状态色：GitHub light 那套，浅底上可读；不沿用深色主题的高饱和 */
    --ok:#1a7f37; --busy:#9a6700; --bad:#cf222e; --idle:#0969da; --accent:#8250df;
    /* claude-code logo 那个珊瑚橙（启动 banner 的颜色）—— pane 的加载屏 + 头条那个方块 logo 用 */
    --claude:#d77757;
    --ok-bg:#e9f5ec; --busy-bg:#fdf4e0; --bad-bg:#fdecec; --idle-bg:#e9f2fd; --accent-bg:#f2ecfd;
    --ok-line:#b7ddc2; --busy-line:#ecd9a3; --bad-line:#f5c4c4;
    --idle-line:#bed9f8; --accent-line:#ddc9f8; --accent-wash:#f8f5fe;
    /* 深度：参考图的卡片几乎只有 1px hairline + 极淡阴影，不用重边框 */
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.05);
    --shadow-lg:0 14px 36px rgba(16,24,40,.16);
    --scrim:rgba(29,29,31,.34);
    --ring:0 0 0 3px rgba(9,105,218,.12);
    /* 节奏：参考图的留白量级明显大于原来的紧凑排版 */
    --r:12px; --r-sm:8px; --gap:12px;
    /* 顶栏（品牌 + 会话 Tab + 版本）的高度，pane 终端据此往下让位 */
    --titlebar-h:46px;
    /* 交互叠色：hover/选中的极淡黑色蒙层（OpenCode 那套 overlay 的轻量版） */
    --ov-hover:rgba(0,0,0,.045); --ov-active:rgba(0,0,0,.075);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:13px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  /* 浅色底上默认滚动条太重，压成细的 */
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--thumb); border-radius:8px;
                            border:3px solid var(--panel); background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--faint); background-clip:padding-box}

  /* ── 通用小件 ─────────────────────────────────────── */
  /* 线性单色小图标：内联 SVG，尺寸统一（参考图的文件夹/终端/放大镜都是这一套） */
  .ico{width:13px; height:13px; flex:0 0 auto; fill:none; stroke:currentColor;
       stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
  /* 元信息胶囊：参考图中央输入框上方的 `📁 默认工作区 ⌄` `⚙ 标准模式 ⌄` */
  .pill{
    display:inline-flex; align-items:center; gap:5px; min-width:0; max-width:100%;
    height:26px; padding:0 10px; border-radius:var(--r-sm);
    background:var(--panel2); border:0;
    color:var(--dim); font-size:11.5px; white-space:nowrap;
  }
  .pill>span{overflow:hidden; text-overflow:ellipsis}
  .pill.warn{color:var(--busy); background:var(--busy-bg); border-color:var(--busy-line)}
  .pill.err{color:var(--bad); background:var(--bad-bg); border-color:var(--bad-line)}
  /* 淡底徽章，标注不成熟/未验证的能力（参考图插件列表的「实验性」） */
  .tag{
    display:inline-block; margin-left:6px; padding:1px 6px; border-radius:5px;
    background:var(--accent-bg); color:var(--accent);
    font-size:10px; font-weight:600; letter-spacing:.2px; white-space:nowrap;
  }

  /* ── 顶栏：品牌 + Tab。就这两样 ───────────────────────
     2026-10-19：Tab 从「读/写轴」改成「域轴」—— 不再是「观察(只读)/操控(可写)」，
     而是「rsi session / kore session」，两个域各一个可写 Tab（rsi 起/停/发，kore 起/杀/打字）。
     根因：两个域都要写，读/写轴本就无法跟域轴对齐。历史映射：旧「操控 Tab」= 现 kore Tab、
     旧「观察 Tab」= 现 rsi Tab —— 下面若有注释仍写「观察/操控」，按此映射读。
     两条元信息带（含 session 切换器）从这里搬进了各自的 pane 子树，所以 header 现在一个
     表单控件都没有 —— 「切换器不在 header 里」从此是数出来的。代价是 header 的 56px 之外，
     每个 pane 顶上多一条 36px 的带子；换来的是分区断言不再依赖 showTab() 的运行时行为
     （这笔账是认过的）。 */
  /* ── 顶栏 titlebar：品牌 · 会话 Tab 条 · 版本（抄 OpenCode 的设计语言）──
     OpenCode 的 Tab 只靠**底色填充 + 文字色**区分状态：没有边框、没有下划线、没有任何
     带颜色的线，也没有「某一边一条线」。顶栏坐在比内容更凹的画布底色（--bg）上，白卡片/
     深色终端自然地浮在其下，分层靠色阶不靠分隔线。活动 Tab = 一块抬起来的浅色面（填充 +
     极淡投影），非活动 = 透明只留文字，hover = 一层极淡的黑色蒙层。
     z-index 高于 pane 终端（它 position:fixed 从 --titlebar-h 往下铺），终端开着也能切 Tab。 */
  header#titlebar{
    flex:0 0 auto; position:relative; z-index:30; background:var(--bg);
    padding:0 12px; display:flex; align-items:center; gap:5px;
    height:var(--titlebar-h); min-height:var(--titlebar-h);
  }
  .brand{display:flex; align-items:center; gap:8px; flex:0 0 auto; white-space:nowrap;
    padding-right:14px; margin-right:3px}
  .brand-logo{color:var(--claude); white-space:pre; line-height:.82; margin:0; font-size:8px}
  .brand-name{font-weight:650; font-size:15px; letter-spacing:.2px; color:var(--text)}
  /* 只有会话 Tab 条装在这条可横滚、两端渐隐的 strip 里（shrink-only，空时不占位）。
     Home / + 在 strip 外面，所以永远清晰、不被遮罩吃掉边。 */
  #tabstrip{flex:0 1 auto; min-width:0; display:flex; align-items:center;
    overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);
            mask-image:linear-gradient(to right,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);
  }
  #tabstrip:not(:has(.ktab)){margin:0; -webkit-mask-image:none; mask-image:none}
  #tabstrip::-webkit-scrollbar{height:0; width:0}
  #tablist{display:flex; align-items:center; gap:3px; min-width:0}
  /* 会话 Tab：无边框、无下划线。状态只靠填充+文字色。 */
  .ktab{
    flex:0 0 auto; display:flex; align-items:center; gap:7px; height:30px;
    max-width:200px; padding:0 7px 0 9px; border-radius:7px; cursor:pointer;
    color:var(--faint); background:transparent; border:0;
    transition:background-color .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .ktab:hover{background:var(--ov-hover); color:var(--dim)}
  .ktab[data-active="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
  /* 首字母小方块：中性浅底（不描边、不用彩线） */
  .ktab-av{flex:0 0 auto; width:17px; height:17px; border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    background:var(--line); color:var(--dim);
    font-size:10px; font-weight:700; text-transform:uppercase}
  .ktab[data-active="true"] .ktab-av{background:var(--line2); color:var(--text)}
  .ktab-t{min-width:0; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-size:12.5px; font-weight:500}
  .ktab-x{flex:0 0 auto; width:18px; height:18px; border-radius:5px; border:0;
    background:transparent; color:var(--faint); font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center; opacity:0;
    transition:opacity .12s ease, background-color .12s ease, color .12s ease}
  .ktab:hover .ktab-x, .ktab[data-active="true"] .ktab-x{opacity:1}
  .ktab-x:hover{background:var(--bad-bg); color:var(--bad)}
  /* Home / + 新建：同一套无边框图标钮，状态靠填充 */
  #tab-home, #tab-new{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    height:30px; border-radius:7px; cursor:pointer;
    color:var(--dim); background:transparent; border:0;
    transition:background-color .12s ease, color .12s ease, box-shadow .12s ease;
  }
  #tab-home{width:32px}
  #tab-new{width:30px}
  #tab-home:hover, #tab-new:hover{background:var(--ov-hover); color:var(--text)}
  #tab-home[data-active="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
  #tab-home .ico, #tab-new .ico{width:15px; height:15px}
  .tb-right{flex:0 0 auto; display:flex; align-items:center; gap:8px; margin-left:auto}
  /* 版本 pill：无边框，极淡文字（OpenCode 自己不显版本，这是按需求的克制加法） */
  .verpill{color:var(--faint); font-size:11px; letter-spacing:.3px;
    padding:2px 6px; border-radius:6px; border:0; background:transparent;
    white-space:nowrap; font-variant-numeric:tabular-nums}
  .verpill:empty{display:none}
  /* Tab 条。两个按钮本身不写任何东西（跟 `+ 新建` 一样只切显示），而且它们长在
     header 里 —— 既不在 rsi Tab 的子树里，也不在 kore Tab 的子树里，所以按域分区的
     结构断言不会被这两个钮污染。 */
  .tabs{flex:0 0 auto; display:flex; gap:4px; padding:2px; border-radius:var(--r-sm);
        background:var(--panel2); border:1px solid var(--line)}
  .tabbtn{
    border:1px solid transparent; background:transparent; color:var(--dim);
    border-radius:6px; padding:3px 12px; font-size:12px; font-weight:600;
    display:flex; align-items:baseline; gap:6px; white-space:nowrap;
  }
  .tabbtn:hover:not(.on){background:var(--panel); border-color:var(--line)}
  .tabbtn.on{background:var(--panel); color:var(--text); border-color:var(--edge);
             box-shadow:var(--shadow)}
  /* 每个 Tab 自己的元信息带：它长在自己那个 pane 的子树里（是 #pane-rsi / #pane-kore 的第一个
     孩子），不在 <header> 里，也不带 `.on` —— 显隐由祖先 pane 的 display:none 决定，不由
     showTab() 决定。于是「run 切换器只在 rsi Tab 出现」是一条关于文件结构的断言：切换器在
     #pane-rsi 子树里，grep 得到。 */
  .hslot{flex:0 0 auto; min-width:0; min-height:36px; display:flex; align-items:center;
         gap:14px; padding:6px 16px; background:transparent}
  /* 元信息胶囊。全部可收缩：窄窗口时先挤胶囊内的文字，不许把顶栏顶破 ——
     顶栏 overflow 是看不见的，只会把 goal 裁掉。 */
  .caps{flex:0 1 auto; min-width:0; display:flex; align-items:center; gap:6px}
  .caps .pill{flex:0 1 auto}
  .goal{flex:1; min-width:0; display:flex; align-items:center; gap:12px}
  .goal-obj{
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-weight:500;
  }
  .goal-none{color:var(--faint); font-weight:400}
  .phase{
    flex:0 0 auto; padding:2px 9px; border-radius:var(--r-sm); font-size:11px; font-weight:600;
    border:1px solid transparent;
  }
  .phase.active  {background:var(--ok-bg);   color:var(--ok);   border-color:var(--ok-line)}
  .phase.blocked {background:var(--bad-bg);  color:var(--bad);  border-color:var(--bad-line)}
  .phase.paused  {background:var(--busy-bg); color:var(--busy); border-color:var(--busy-line)}
  .phase.complete{background:var(--idle-bg); color:var(--idle); border-color:var(--idle-line)}
  .rounds{flex:0 0 auto; display:flex; align-items:center; gap:8px; color:var(--dim); font-size:11px}
  .bar{width:110px; height:5px; border-radius:3px; background:var(--line); overflow:hidden}
  .bar>i{display:block; height:100%; background:var(--accent); border-radius:3px}
  .tick{flex:0 0 auto; color:var(--faint); font-size:11px; text-align:right; white-space:nowrap}
  /* session switcher: the board used to silently pin itself to whatever session
     it picked first. Now the choice is visible and changeable.
     appearance:none 是为了自己画 ⌄（原生箭头会被胶囊裁掉）；max-width 用 min(px,vw)
     而不是死 px：窄窗口先挤 session 标签，别去挤顶栏里最该看见的 objective。 */
  select.sw{
    flex:0 1 auto; width:auto; max-width:min(300px,17vw); min-width:0;
    font-size:11.5px; padding:2px 0; text-overflow:ellipsis;
    appearance:none; -webkit-appearance:none;
    background:transparent; border:0; border-radius:6px; color:var(--dim); cursor:pointer;
  }
  .pill-sel{cursor:pointer}
  .pill-sel::after{
    content:''; flex:0 0 auto; width:5px; height:5px; margin:0 1px 3px 2px;
    border-right:1.3px solid var(--faint); border-bottom:1.3px solid var(--faint);
    transform:rotate(45deg);
  }
  /* 换肤前是 flex:0 0 auto + nowrap：加了三个胶囊后窄窗口会把 goal 挤没。改成可
     收缩 + 省略号（全文进 title），警告本身一个字都没少。 */
  .stale{flex:0 1 auto; min-width:0; font-size:11px; color:var(--busy);
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  /* ── layout ───────────────────────────────────────────
     换肤把「边到边的深色面板 + 分隔线」改成「灰白底上的白卡片 + 留白」。
     两个 Tab 各是一块 `.tab-pane`，只有带 `.on` 的那一块显示。
     2026-10-16 观察 Tab 重做成「rsi run 深度检视台」。2026-10-19 布局重设计（owner 拍「对话 +
     右检视栏」）：main 两列 —— 左 .run-wrap 主角（transcript 吃满高度），右 .rsi-rail 检视栏
     定宽竖排三卡（技能库 / 引擎 / 底座），如实映射 rsi agent 的真身：它长出了哪些技能、由什么
     MCP/tools 固定构成、循环转到第几轮（适应度 phase 3 前诚实标未接）。原来底部那条 268px 的
     footer 三卡会把活 transcript 挤掉一大截；迁进右侧栏后 transcript 拿回全部高度、检视降为侧栏，
     底座（本会话固定、极少看）默认折叠。两个 Tab 的 main 都 .last 收底边（footer 已退役）。 */
  .tab-pane{display:none}
  .tab-pane.on{flex:1; min-height:0; display:flex; flex-direction:column}
  main{flex:1; min-height:0; display:flex; gap:var(--gap); padding:var(--gap) var(--gap) 0}
  main.last{padding-bottom:var(--gap)}
  .run-wrap{flex:1; min-width:0; display:flex; flex-direction:column}
  /* 单 run transcript 头：objective 已在顶栏 #o-goal，这里放 goal_id / 用时 / 资产 / 停因 / note。 */
  .run-head{flex:0 0 auto; padding:6px 14px; border-bottom:1px solid var(--line);
            color:var(--dim); font-size:11px; line-height:1.6}
  .run-head .rh-warn{color:var(--bad)}
  /* 右检视栏：定宽竖排，不抢 transcript 的弹性（.run-wrap flex:1 吃剩下的全部宽）。 */
  .rsi-rail{flex:0 0 300px; min-width:0; display:flex; flex-direction:column; gap:var(--gap)}
  /* 栏内三卡竖排、分纵向空间：技能库稍高（RSI 产出读数），引擎次之，底座折叠时只占标题高。
     min-width:240px 留着当窄屏复位前的下限（和下面媒体查询那条配套），栏宽 300 容得下。 */
  .pane-col{flex:1; min-width:240px; min-height:0; display:flex; flex-direction:column}
  .pane-col.skills{flex:1.3; min-width:260px}
  .pane-col.engine{flex:1; min-width:240px}
  .pane-col.base{flex:1; min-width:240px}
  /* 底座折叠：只占标题高、藏起 .scroll；标题整条可点，caret 指示开合（▾ 开 / ▸ 合）。 */
  .pane-col.base.collapsed{flex:0 0 auto}
  .pane-col.base.collapsed>.scroll{display:none}
  .pane-col.base>.ttl{cursor:pointer; user-select:none}
  .pane-col.base .caret{display:inline-block; width:5px; height:5px; margin:0 3px 2px 0;
    border-right:1.3px solid var(--faint); border-bottom:1.3px solid var(--faint);
    transform:rotate(45deg); transition:transform .12s}
  .pane-col.base.collapsed .caret{transform:rotate(-45deg)}
  /* kore Tab：kore sessions 列表吃满整屏弹性（新建表单 + roster）。2026-10-19 域轴重构后
     这一屏只剩这一块 —— 原先并排的 RSI 对话卡（.jobwrap）已整体迁进 rsi Tab，
     .jobwrap 规则现在是死 CSS（markup 里不再有 .jobwrap，下面媒体查询里的残留选择器
     匹配不到任何元素，无害，留着以免动逗号列表）。 */
  .kwrap{flex:1; min-width:0; display:flex; flex-direction:column}
  .jobwrap{flex:0 0 372px; min-width:0; display:flex; flex-direction:column}
  /* 卡片：白底 + 1px hairline + 极淡阴影 + 12px 圆角，不用重边框（参考图 05/06）。
     样式与弹性分开：`.card` 只管长相，flex 挡位在上面各自的类里。 */
  /* 卡片：不描边。用「0.5px 全周淡环 + 柔和投影」抬起来（抄 OpenCode 的 elevation——
     环是**整圈**、近乎中性的极淡黑，不是某一边的线，也不是彩线）。 */
  .card{
    background:var(--panel); border-radius:var(--r);
    box-shadow:0 0 0 .5px rgba(17,24,39,.06), var(--shadow); overflow:hidden;
  }
  /* 面板标题：参考图的「插件 / 添加和管理插件」那种中等字重深色标题 + 灰色计数，
     不再是全大写的运维面板小标签。 */
  .ttl{
    flex:0 0 auto; padding:11px 16px 10px; font-size:13px; font-weight:600;
    letter-spacing:0; color:var(--text); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px;
  }
  .ttl .n{color:var(--faint); font-weight:400; font-size:11.5px; letter-spacing:0}
  /* 底座卡标题里「本会话固定」这类诚实子标：比标题轻、比计数醒目，点不动（纯声明） */
  .ttl .muted{color:var(--dim); font-weight:400; font-size:11px; letter-spacing:0;
              border:1px solid var(--line); border-radius:5px; padding:1px 6px}
  /* 手动刷新钮（见 markup 处注释）：平时读缓存秒回，点它才真重扫；转圈只在重扫那一下 */
  #c-refresh{display:inline-flex; align-items:center; gap:5px}
  #c-refresh svg{width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  #c-refresh.spin svg{animation:paneSpin .8s linear infinite; transform-origin:center}
  .scroll{flex:1; min-height:0; overflow:auto}
  /* 空态：参考图的留白量级。An empty panel must say why it is empty (plan §5-3). */
  .empty{padding:44px 24px; color:var(--faint); text-align:center; font-size:12px}
  .empty b{display:block; color:var(--text); font-weight:600; font-size:13.5px; margin-bottom:9px}
  .empty .why{display:inline-block; max-width:560px; text-align:left; line-height:1.7; color:var(--dim)}

  /* ── data-supply strip: the standing answer to "why is that view blank" ── */
  .diag{
    flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel2);
    padding:9px 16px; font-size:11px; color:var(--faint); line-height:1.9;
  }
  .diag b{color:var(--dim); font-weight:600}
  .diag .z{color:var(--busy)}
  /* 每个事件家族一枚淡底胶囊，0 的那几个挂「未验证」徽章 */
  .diag .c{
    display:inline-block; margin:0 4px 0 0; padding:1px 8px; border-radius:6px;
    background:var(--panel); border:1px solid var(--line);
  }
  .diag .hd{color:var(--text); font-weight:600; margin-right:6px}
  .diag .why{margin-top:5px; color:var(--dim); line-height:1.7}

  /* ── event timeline ───────────────────────────────── */
  .ev{
    display:flex; gap:9px; padding:4px 16px; border-bottom:1px solid var(--line2);
    align-items:baseline; font-size:11.5px;
  }
  .ev:hover{background:var(--panel2)}
  .ev .t{flex:0 0 58px; color:var(--faint); font-family:ui-monospace,Menlo,Consolas,monospace}
  /* 事件种类徽章：参考图「实验性」那种淡底 + 深色字，不描边 */
  .ev .k{
    flex:0 0 66px; font-size:10px; font-weight:600; text-align:center;
    border:1px solid transparent; border-radius:5px;
    background:var(--panel2); color:var(--dim);
  }
  .ev .l{flex:0 0 auto; max-width:230px; overflow:hidden; text-overflow:ellipsis;
         white-space:nowrap; font-weight:600}
  .ev .d{flex:1; min-width:0; color:var(--dim); overflow:hidden;
         text-overflow:ellipsis; white-space:nowrap}
  .ev.bad .l{color:var(--bad)}
  .ev.k-user .k{color:var(--idle); background:var(--idle-bg)}
  .ev.k-assistant .k{color:var(--accent); background:var(--accent-bg)}
  .ev.k-tool .k{color:var(--ok); background:var(--ok-bg)}
  .ev.k-retry .k{color:var(--bad); background:var(--bad-bg)}
  .ev.k-turn{background:var(--accent-wash)}
  .ev.k-turn .k{color:var(--accent); background:var(--accent-bg)}

  /* ── rsi 底座镜像：技能库 / 底座 / 引擎（2026-10-17，替代退役的 gate verdicts CSS）── */
  /* 技能库：一条 = 一个学到的可复用能力 */
  .sk{padding:10px 16px; border-bottom:1px solid var(--line2)}
  .sk:hover{background:var(--panel2)}
  .sk-h{display:flex; align-items:baseline; gap:7px}
  .sk-name{font-size:12.5px; font-weight:600; color:var(--text); word-break:break-word}
  .sk-dir{font-size:10.5px; color:var(--faint); font-family:ui-monospace,Menlo,Consolas,monospace}
  .sk-desc{margin-top:4px; font-size:11.5px; color:var(--dim); line-height:1.55; word-break:break-word}
  .sk-meta{margin-top:5px; font-size:10.5px; color:var(--faint)}
  /* 底座：key/value 行 + 工具/MCP 名的小 chip */
  .bs-row{display:flex; gap:10px; padding:8px 16px; border-bottom:1px solid var(--line2); font-size:11.5px}
  .bs-k{flex:0 0 58px; color:var(--faint); font-weight:600}
  .bs-v{flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center;
        color:var(--dim); word-break:break-word}
  .bs-chip{font-size:10.5px; color:var(--dim); border:1px solid var(--line); border-radius:5px;
           padding:1px 6px; font-family:ui-monospace,Menlo,Consolas,monospace}
  .bs-none{color:var(--faint)}
  .bs-note{padding:8px 16px; font-size:11px; color:var(--faint); line-height:1.55; word-break:break-word}
  /* 引擎：适应度诚实旗标 —— 未接时是中性灰（不是红/绿假信号），接上后转绿 */
  .eng-fit{margin:10px 16px; padding:8px 10px; border-radius:var(--r-sm); border:1px solid}
  .eng-fit.pending{color:var(--dim); border-color:var(--edge); background:var(--panel2)}
  .eng-fit.wired{color:var(--ok); border-color:var(--ok-line); background:var(--ok-bg)}
  .eng-fit-h{font-size:11.5px; font-weight:600}
  .eng-fit-note{margin-top:5px; font-size:11px; line-height:1.55; color:var(--faint); word-break:break-word}

  /* ── RSI loop 相位徽章 ───────────────────────────────
     三态配色自成一套（在跑 busy / 待命 idle / 已收尾 绿 / 最后已知·未记录 灰），不依赖别的卡。
     2026-10-16：旧的「观察 loop run 列表」退役后，这套 .lp-fin 相位徽章改由
     renderRunHead（观察的选中 run 头）复用——只读、无按钮。 */
  .lp{padding:11px 16px; border-bottom:1px solid var(--line2)}
  .lp-h{display:flex; align-items:baseline; gap:7px; font-size:11px}
  .lp-id{font-weight:600; color:var(--text); font-family:ui-monospace,Menlo,Consolas,monospace}
  .lp-fin{font-size:10px; padding:1px 7px; border-radius:6px; border:1px solid}
  .lp-fin.done{color:var(--ok); border-color:var(--ok-line); background:var(--ok-bg)}
  .lp-fin.on{color:var(--busy); border-color:var(--busy-line); background:var(--busy-bg)}
  .lp-fin.off{color:var(--dim); border-color:var(--line)}
  .lp-fin.idle{color:var(--idle); border-color:var(--idle-line); background:var(--idle-bg)}
  .lp-fin.none{color:var(--faint); border-color:var(--line)}
  .lp-c{margin-left:auto; color:var(--faint); white-space:nowrap}
  .lp-obj{margin-top:6px; font-size:11.5px; color:var(--dim); line-height:1.6}
  .lp-why{margin-top:5px; font-size:11px; color:var(--busy); word-break:break-word}
  .lp-meta{margin-top:6px; font-size:10.5px; color:var(--faint)}

  /* ── DAG ──────────────────────────────────────────── */
  #dag{width:100%; height:100%; display:block}
  .node-box{fill:var(--panel2); stroke:var(--line); rx:10}
  .node-box.done   {stroke:var(--ok)}
  .node-box.running{stroke:var(--busy)}
  .node-box.blocked{stroke:var(--bad)}
  .node-t{fill:var(--text); font-size:12px; font-weight:600}
  .node-s{fill:var(--dim); font-size:10px}
  .edge{stroke:var(--edge); stroke-width:1.4; fill:none; marker-end:url(#o-ar)}
  /* 箭头颜色跟着 --edge 走：换肤前它是写死在 <marker> 里的深色 hex */
  #o-ar path{fill:var(--edge)}

  /* ── kore sessions ──────────────────────────────────────
     行式布局照参考图 07 的插件列表：状态点 | 名字 + 徽章 | 灰色描述行 | 操作。
     行之间只留极浅分隔线，靠留白分组。 */
  /* 2026-10-13 owner：行=巡检卡，主操作是打开终端 —— 整行可点进 pane（不止一颗钮）。 */
  .k-row{padding:12px 16px; cursor:pointer}
  .k-row:hover{background:var(--ov-hover)}
  .k-row.protected{background:var(--accent-wash)}
  /* 键盘高亮（R7FIX-3 任务三）。左边一条实线 + 浅底，和 .protected 的底色可以叠加而不
     互相吃掉；#c-list 自己拿焦点，所以 outline 画在行上而不是容器上。 */
  .k-row.sel{background:var(--line2)}
  #c-list:focus{outline:none}
  #c-list:focus .k-row.sel{background:var(--line)}
  .k-h{display:flex; align-items:center; gap:7px}
  /* 状态点：owner「busy 跟 idle 都灰糊糊的，没区分度」。所以两条线一起拉开 ——
     颜色（idle 稳定蓝 / busy 暖琥珀）+ 形态（busy 多一圈呼吸的光晕，idle 不动）。
     光晕动的是 ::after 的 transform/opacity（只上合成器、不触发重排/重绘），一行一个、
     roster 就那么几个，常开无妨；颜色沿用主题 var() 所以深浅主题各自对。 */
  .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto; position:relative}
  .dot.idle{background:var(--idle); box-shadow:0 0 0 2px var(--idle-bg)}
  .dot.busy{background:var(--busy)}
  .dot.busy::after{content:''; position:absolute; inset:0; border-radius:50%;
    border:1.5px solid var(--busy); animation:dotPulse 1.6s ease-out infinite}
  @keyframes dotPulse{0%{transform:scale(1);opacity:.7} 100%{transform:scale(2.4);opacity:0}}
  .dot.dead{background:var(--bad); box-shadow:0 0 0 2px var(--bad-bg)}
  .dot.tmux_only{background:var(--edge)}
  /* 2026-10-13：操控区不轮询 roster（读缓存+手动刷新），屏上这批状态会一直变旧。年龄过线后
     把点变淡、并停掉 busy 的呼吸光晕 —— 一个还在喘的 busy 点配一份两分钟前的快照，是页面在
     说假话。变淡=「这是旧的，别当此刻」，由 renderK 的年龄计时器 toggle #c-list.stale-age。*/
  #c-list.stale-age .dot{opacity:.45}
  #c-list.stale-age .dot.busy::after{animation:none; display:none}
  .k-n{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .k-tag{
    margin-left:auto; flex:0 0 auto; font-size:10px; color:var(--dim);
    background:var(--panel2); border:0; border-radius:5px;
    padding:2px 7px; white-space:nowrap;
  }
  .k-tag.lock{color:var(--accent); background:var(--accent-bg); border-color:var(--accent-line)}
  /* 2026-10-13 owner：星标取代注册表那种「精选子集」—— 点亮=置顶。右端一颗描边星，
     亮起来填成金色。只持久化在 localStorage，不进任何服务端状态。 */
  .k-star{
    flex:0 0 auto; width:24px; height:24px; margin:-3px -4px -3px 0; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    border:0; background:none; cursor:pointer; color:var(--faint); border-radius:6px;
  }
  .k-star:hover{background:var(--panel2); color:var(--text)}
  .k-star svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round}
  .k-star.on{color:#e0a92e}
  .k-star.on svg{fill:currentColor}
  /* 2026-10-13 owner：杀挪到列表行上。这环境原生 window.confirm 被吞（一点就当取消），所以
     不靠弹窗，改页内两步确认（见 kKillClick）：静息是一颗描边垃圾桶，待命态整颗变红底白字
     「确认杀」—— 强到不可能误读，再点一次才真杀。 */
  .k-kill{
    flex:0 0 auto; width:24px; height:24px; margin:-3px 0; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    border:0; background:none; cursor:pointer; color:var(--faint); border-radius:6px;
  }
  .k-kill:hover{background:var(--bad-bg); color:var(--bad)}
  .k-kill svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round}
  .k-kill.arm{width:auto; padding:0 8px; background:var(--bad); color:#fff; font-size:11px; font-weight:600}
  .k-kill.arm:hover{background:var(--bad); color:#fff}
  .k-m{color:var(--dim); font-size:11px; margin-top:4px; word-break:break-all}
  /* 行高从 1.5 提到 1.55 后，46px 正好把第三行切成两半：抬到 52px 让 line-clamp 自己收尾 */
  .k-s{
    color:var(--faint); font-size:11px; margin-top:6px; max-height:52px; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; white-space:pre-wrap;
  }
  /* 次按钮：白底 + 1px 浅灰描边（参考图「添加 API Key」/「去充值」） */
  button{
    font:inherit; font-size:11.5px; color:var(--text); background:var(--panel);
    border:1px solid var(--line); border-radius:var(--r-sm); padding:4px 10px; cursor:pointer;
  }
  button:hover:not(:disabled){background:var(--panel2); border-color:var(--edge)}
  button:disabled{opacity:.45; cursor:not-allowed}
  /* 主按钮：纯黑底白字，无渐变无阴影（参考图「登录」/「继续」/「+ 添加插件」）。
     只给「确认这一步」的按钮用，工具条上的读操作一律走次按钮。 */
  button.primary{background:var(--btn); border-color:var(--btn); color:var(--btn-text)}
  button.primary:hover:not(:disabled){background:var(--btn-hover); border-color:var(--btn-hover)}
  /* 「起」待命确认态：整颗变红「确认起」，和停/杀的待命同配色（见 k-kill.arm）。 */
  button.primary.arm, button.primary.arm:hover:not(:disabled){
    background:var(--bad); border-color:var(--bad); color:#fff; font-weight:600}
  button.danger:hover:not(:disabled){
    border-color:var(--bad-line); background:var(--bad-bg); color:var(--bad);
  }
  input, select, textarea{
    font:inherit; font-size:12px; color:var(--text); background:var(--panel);
    border:1px solid var(--line); border-radius:var(--r-sm); padding:7px 10px; width:100%;
  }
  /* 聚焦：中性反馈 —— 不用彩色描边、不用彩色辉光，只把边框压深一档 + 一圈中性柔环。 */
  input:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--edge); box-shadow:0 0 0 3px var(--line2);
  }
  input::placeholder{color:var(--faint)}
  /* 新建会话表单：卡中卡——一块圆角浅底的内嵌面板，不描边、不用分隔线，靠留白与填充分区。 */
  .form{display:none; margin:4px 14px 14px; padding:14px 16px;
        background:var(--panel2); border-radius:var(--r)}
  .form.open{display:block}
  .form label{display:block; color:var(--dim); font-size:11.5px; font-weight:500; margin:12px 0 5px}
  .form > label:first-child{margin-top:0}
  /* 「添加机器」面板：复用 .form 的收起/展开。两步命令各一行，等宽、可整行复制。 */
  .join-step{color:var(--dim); font-size:11.5px; font-weight:500; margin:14px 0 6px}
  .join-step:first-child{margin-top:0}
  .join-code{display:flex; gap:8px; align-items:stretch}
  .join-code input{flex:1 1 auto; min-width:0; font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:11.5px; background:var(--panel); color:var(--text)}
  .join-code button{flex:0 0 auto; padding:0 14px; font-size:12px}
  .join-note{color:var(--faint); font-size:11.5px; line-height:1.6; margin-top:12px}
  .join-note code{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; color:var(--dim)}
  .join-cl{display:flex; gap:8px; align-items:baseline; font-size:11.5px; padding:3px 0}
  .join-cl .ip{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; color:var(--text)}
  .join-cl .st{flex:0 0 auto; font-weight:600}
  .join-cl .st.ok{color:var(--ok)} .join-cl .st.warn{color:var(--busy)} .join-cl .st.off{color:var(--faint)}
  .join-cl .why{color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .k-btns{display:flex; gap:8px; margin-top:16px}
  .k-btns button{padding:7px 16px; font-size:12px}
  .jobs{padding:8px 16px; font-size:11px; color:var(--dim)}
  .job{display:flex; gap:6px; padding:3px 0; align-items:baseline}
  .job .st{flex:0 0 auto; font-weight:600}
  .job .st.done{color:var(--ok)} .job .st.failed{color:var(--bad)}
  .job .st.running,.job .st.queued{color:var(--busy)}
  .job .msg{color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* ── RSI loop 入口（操控右栏；2026-10-13 owner 授权板子能起 loop）──
     goal 编辑器复用 .form（默认收起、.open 展开），和「新建 session」那个表单同一套。
     goal JSON 用等宽文本域（原始 JSON 最灵活，契合「自定义」）。监控行是只读的，读
     /api/loop/runs 的 heartbeat 画「第几轮 / 哪个 phase / 在不在跑」。 */
  .form textarea.goaljson{width:100%; box-sizing:border-box; resize:vertical;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; line-height:1.5;
    color:var(--text); background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; min-height:160px}
  .form textarea.goaljson:focus{outline:none; border-color:var(--accent)}
  .lp-run{display:flex; gap:6px; padding:4px 0; align-items:baseline; font-size:11px;
    border-bottom:1px solid var(--line)}
  .lp-run:last-child{border-bottom:0}
  .lp-run .id{flex:0 0 auto; color:var(--text);
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .lp-run .ph{flex:0 0 auto; font-weight:600}
  .lp-run .ph.on{color:var(--busy)} .lp-run .ph.off{color:var(--dim)}
  .lp-run .ph.done{color:var(--ok)} .lp-run .ph.none{color:var(--faint)}
  /* 待命 = 这轮跑完了、session 还活着、在等你追加（蓝，和「在跑」的琥珀分得开）。 */
  .lp-run .ph.idle{color:var(--idle)}
  .lp-run .m{flex:1; min-width:0; color:var(--dim); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  /* 停钮：静息时低调（dim 边框），待命时整颗变红「确认停」—— 和 k-kill.arm 同配色 */
  .lp-stop{flex:0 0 auto; border:1px solid var(--line); background:transparent;
    color:var(--dim); font-size:11px; padding:0 7px; border-radius:3px; cursor:pointer}
  .lp-stop:hover{border-color:var(--bad); color:var(--bad)}
  .lp-stop.armed{background:var(--bad); color:#fff; border-color:var(--bad); font-weight:600}
  .lp-stop.armed:hover{background:var(--bad); color:#fff}
  /* 追加钮：和停钮一个块头，静息低调；点开它才露出下面的 composer。发 = 又放一轮自主
     工作，所以也走两步（亮蓝「确认发」）—— 和「起」同级分量。2026-10-15。 */
  .lp-add{flex:0 0 auto; border:1px solid var(--line); background:transparent;
    color:var(--dim); font-size:11px; padding:0 7px; border-radius:3px; cursor:pointer}
  .lp-add:hover{border-color:var(--idle); color:var(--idle)}
  .lp-add.open{border-color:var(--idle); color:var(--idle); font-weight:600}
  .lp-send{display:flex; gap:6px; padding:2px 0 6px; align-items:flex-start}
  .lp-send textarea{flex:1; min-width:0; min-height:34px; resize:vertical;
    font:inherit; font-size:11px; border:1px solid var(--line); border-radius:4px;
    padding:4px 6px; background:var(--line2); color:var(--text)}
  .lp-send button{flex:0 0 auto; border:1px solid var(--idle); background:transparent;
    color:var(--idle); font-size:11px; padding:0 9px; border-radius:3px; cursor:pointer}
  .lp-send button.armed{background:var(--idle); color:#fff; font-weight:600}
  /* 「看」钮：和停/追加一个块头，静息低调；展开 trace 面板时整颗点亮（文字变「收」）。 */
  .lp-see{flex:0 0 auto; border:1px solid var(--line); background:transparent;
    color:var(--dim); font-size:11px; padding:0 7px; border-radius:3px; cursor:pointer}
  .lp-see:hover{border-color:var(--text); color:var(--text)}
  .lp-see.open{border-color:var(--text); color:var(--text); font-weight:600}
  /* trace 面板：一个 run 的只读时间线（agent 发言 + 工具链），限高滚动、钉底看最新。 */
  .lp-trace{max-height:300px; overflow-y:auto; margin:2px 0 8px; padding:6px 8px;
    border:1px solid var(--line); border-radius:4px; background:var(--line2);
    font-size:11px; line-height:1.5}
  .tr-ev{display:flex; gap:6px; align-items:baseline; padding:1px 0}
  .tr-t{flex:0 0 auto; color:var(--faint);
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10px}
  .tr-b{flex:1; min-width:0; white-space:pre-wrap; word-break:break-word}
  .tr-ip{flex:0 0 auto; max-width:45%; color:var(--dim); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10px}
  .tr-agent .tr-b{color:var(--text)}
  .tr-you .tr-b{color:var(--idle); font-weight:600}
  .tr-tool .tr-b{color:var(--busy)}
  .tr-sys{color:var(--faint)}
  .tr-sys-ev{justify-content:center}

  /* 2026-10-19 transcript 按轮分组：每轮一块，轮头 sticky 留顶、点它折叠整块；块体里工具调用
     再折一层（默认收起、点开才列），避免满屏 ⚙ 工具噪声。最新一块默认展开、历史块默认收起。 */
  .tr-grp{border-top:1px solid var(--line); margin-top:2px}
  .tr-grp:first-child{border-top:0; margin-top:0}
  .tr-ghead{position:sticky; top:0; z-index:1; display:flex; gap:6px; align-items:baseline;
    padding:4px 2px; background:var(--panel); cursor:pointer; user-select:none;
    font-weight:600; color:var(--text)}
  .tr-gcar{flex:0 0 auto; color:var(--faint); font-size:10px; width:9px}
  .tr-gttl{flex:1; min-width:0}
  .tr-gbody{padding:2px 0 6px 9px}
  .tr-grp.collapsed .tr-gbody{display:none}
  .tr-tools{margin-top:2px}
  .tr-tfold{cursor:pointer; user-select:none; color:var(--busy); font-size:11px; padding:1px 0}
  .tr-tlist{padding-left:8px; border-left:1px solid var(--line2); margin:2px 0}
  .tr-tools:not(.open) .tr-tlist{display:none}
  .tr-report{margin-top:3px; color:var(--dim); white-space:pre-wrap; word-break:break-word;
    border-left:2px solid var(--line); padding-left:8px}
  /* 轮的盘上增量（2026-10-20）：轮前 sha → 轮后 sha + git diff --stat。一轮没改动盘上任何
     文件时这块诚实地这么说，而不是留白让人以为没数据。 */
  .tr-delta{margin:2px 0 3px; color:var(--dim); font-size:11px; white-space:pre-wrap;
    word-break:break-all}
  .tr-delta .tr-sha{color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ── RSI session 聊天版（2026-10-16）：顶 chip 行 + 中对话流 + 底撰写框 ──
     原来「输入在上 / run 列表 / 每行折叠 trace / 另一个最近写操作框」读着像批处理监视器，
     owner 要「多轮对话框」的感觉：convo 吃弹性居中、撰写框钉底、chip 切 run。 */
  .lp-chips{flex:0 0 auto; display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px;
    border-bottom:1px solid var(--line)}
  .lp-chip{display:inline-flex; align-items:center; gap:5px; cursor:pointer; font-size:11px;
    border:1px solid var(--line); border-radius:999px; padding:3px 10px;
    color:var(--dim); background:transparent}
  .lp-chip:hover{border-color:var(--idle-line); color:var(--text)}
  .lp-chip.sel{border-color:var(--accent); color:var(--accent); background:var(--accent-wash)}
  .lp-chip.new{color:var(--idle); border-style:dashed}
  .lp-chip .q{color:var(--busy); font-weight:600}
  .lp-convo{flex:1; min-height:120px; padding:8px 16px; background:var(--panel)}
  /* 对话顶 header：goal + phase 徽章 + 活 run 的「停」钮 */
  .lp-chead{display:flex; align-items:baseline; gap:8px; padding:0 0 6px; margin-bottom:6px;
    border-bottom:1px solid var(--line2)}
  .lp-chead .g{flex:1; min-width:0; color:var(--dim); font-size:11px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .lp-chead .ph{flex:0 0 auto; font-weight:600; font-size:11px}
  .lp-chead .ph.on{color:var(--busy)} .lp-chead .ph.off{color:var(--dim)}
  .lp-chead .ph.done{color:var(--ok)} .lp-chead .ph.idle{color:var(--idle)}
  .lp-chead .ph.none{color:var(--faint)}
  /* 撰写框钉底：和 kore 列表那套白底次按钮 / 黑主按钮同配色（主按钮 .arm = 红「确认」态） */
  .lp-composer{flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel2);
    padding:10px 16px}
  .lp-composer textarea{width:100%; box-sizing:border-box; resize:vertical; min-height:48px;
    font:inherit; font-size:12px; line-height:1.5; color:var(--text);
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 9px}
  .lp-composer textarea:focus{outline:none; border-color:var(--accent)}
  .lp-composer textarea:disabled{background:var(--line2); color:var(--faint); cursor:not-allowed}
  .lp-composer-row{display:flex; align-items:center; gap:8px; margin-top:7px}
  .lp-composer-row .k-m{flex:1; min-width:0; margin-top:0}

  /* ── pane modal ───────────────────────────────────── */
  .modal{
    position:fixed; inset:0; background:var(--scrim); display:none;
    align-items:center; justify-content:center; z-index:20; padding:24px;
  }
  .modal.open{display:flex}
  .modal-box{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow-lg); overflow:hidden;
    width:min(1100px,100%); max-height:100%; display:flex; flex-direction:column;
  }
  .modal-h{padding:12px 18px; display:flex;
           align-items:center; gap:10px; font-weight:600}
  .modal-b{flex:1; min-height:0; overflow:auto; padding:14px 18px; margin:0;
           white-space:pre-wrap; font-family:ui-monospace,Menlo,Consolas,monospace;
           font-size:11.5px; color:var(--text); background:var(--panel2)}
  /* ROUND8：真终端的宿主。xterm 自己管滚动和字号（它按 cols×rows 排版，padding 会让
     它算错可用宽度），所以这里只给它一个定高的黑底盒子，不给 padding、不给 overflow。
     `display:none` 默认关着：xterm.js 加载不成功时它一个像素都不占，#c-pane-body 那个
     <pre> 原样顶上去（降级路径，任务书验收线 D）。两者永远只有一个带 .on。
     ROUND9 第二轮：字号固定、几何跟着盒子走（见 paneFitGeom），所以盒子和终端的尺寸
     本来就只差不到一个字宽/字高 —— 居中仍然留着（那点余量平均分到两边比全堆在右下角
     诚实），`overflow:auto` 是给**调不动的对面**留的：不可写的目标（或者 resize 被拒）
     几何就还是对面那个 131×36，字号又不许再缩成 6px 去迁就它，所以多出来的部分必须能
     滚出来看，不能被切掉。
     2026-10-12：内边距挂在**里面那层 .xterm 上**，不挂在 #c-pane-term 上 —— 这是「浏览器
     里看得见两层滚动条」的来源。量盒子用的是 fit addon 的 proposeDimensions，它拿
     #c-pane-term 的 clientWidth/clientHeight（含内边距的那一块），却只把 `.xterm` 自己的
     内边距减掉；挂在 #c-pane-term 上的 6/8/10px 于是被当成可用空间发给了对面，对面照着
     多出来的格数画，终端就必然比内容框大那么十几个像素 —— 外面这层 overflow:auto 一定长
     出一条滚动条，而里面 .xterm-viewport 的那条是 overflow-y:scroll、永远在。
     overscroll-behavior:contain：滚到终端回看历史的尽头之后，不许把这一发滚动接着传给
     外面那层（滚动链）。 */
  #c-pane-term{display:none; background:#212121}  /* 2026-10-13 跟终端 Material Darker 底色一致，别让内边距/居中黑边露出纯黑 */
  #c-pane-term .xterm{padding:6px 8px 0 10px}
  /* 右边那条滚动条不画了（2026-10-12，owner：「右边那个滚动条 也很扎眼 是不是可以干掉」）。
     它是 vendor 的 xterm.css 钉的：`.xterm-viewport{overflow-y:scroll}` —— scroll 而不是
     auto，所以哪怕一行回看历史都没有，那条灰槽也一直在，而且它压在终端右边第一列上。
     vendor 那个文件一个字节都不许改（版本和 sha256 都钉死了，见 vendor/xterm/VENDOR.md），
     所以在这儿盖掉，而且只在这个弹窗里盖（`#c-pane-term` 开头）—— 观察 Tab 那边谁也没用
     xterm。
     干掉的是**那条槽**，不是滚动本身：overflow 还在（换成 auto），滚轮、拖选自动滚、
     Shift+PageUp 全照旧，xterm 自己量 scrollBarWidth 的时候量到 0，于是那一列也还给了
     正文。两个前缀是因为 scrollbar-width 是标准的（Firefox 支持），而 Chrome/Safari 到
     今天还只认 ::-webkit-scrollbar。 */
  #c-pane-term .xterm-viewport{overflow-y:auto; overscroll-behavior:contain;
                               scrollbar-width:none; -ms-overflow-style:none}
  #c-pane-term .xterm-viewport::-webkit-scrollbar{width:0; height:0}
  /* 宿主默认**不是一个能滚的盒子**（2026-10-12，owner：「滑动的时候还是有点上下抖动，
     不是 fix 住的」）。为什么会抖：宿主留着 overflow:auto 的时候，里面那层 .xterm 的高度
     只要比内容框多出一两个像素（行高是分数像素，rows × lineHeight 取整之后基本一定会多
     出来一点），宿主就成了第二个能滚的盒子 —— 而滚轮事件走的是**里面**那层 viewport，
     滚到尽头那一下滚动链接着传给宿主，宿主就把整块终端上下挪那一两像素。看起来就是「终端
     没钉住」。现在要滚的只有一个盒子：.xterm-viewport。
     overscroll-behavior:contain 挂在 viewport 上，不挂在宿主上：滚动链是从**真正在滚的
     那个盒子**开始传的，挂在宿主上只能挡住「宿主 → 整页」这一段，挡不住「viewport →
     宿主」那一段，而后者正是上面那一下抖动。
     `.scroll` 是给**装不下**的那种对面留的（只读目标 / resize 被拒：几何还是对面那个
     131×36，字号又不许缩成 6px 去迁就它）。那时候多出来的部分必须能滚出来看，不能被切掉
     —— 这一支里居中也得撤掉：flex 的居中会把溢出的那一半顶到盒子上边界**外面**，滚上去
     是滚不到的。谁挂这个类见 paneSetGeom（本地终端改尺寸的唯一入口）。 */
  #c-pane-term.on{display:flex; align-items:center; justify-content:center;
                  flex:1; min-height:0; overflow:hidden; position:relative}
  #c-pane-term.on.scroll{overflow:auto; align-items:flex-start; justify-content:flex-start}
  /* 开 pane / 重订的头几帧先盖住终端,只露盒子的 #000 黑底 —— 不让人看见 prime 那张「对面
     几秒前、而且是旧尺寸」的裸快照铺在盒子里(内容只填上半截、claude 的输入行悬在页面中间,
     就是 owner 报的「输入框在页面中间不是最底下」;见 paneApplyTerm 里 f.prime 那段)。盖的是
     里层 .xterm 用 visibility(不是 display:none):盒子的布局尺寸要留着给 FitAddon 量,量不出来
     会退回对面旧几何。第一帧真内容(非 prime)落地、或兜底超时到点就揭,见 paneReveal。 */
  #c-pane-term.on.sizing .xterm{visibility:hidden}
  /* claude-code 启动 banner 那个方块 logo（owner 2026-10-12 贴来的真图）。两处复用：pane 头条
     缀一个小的、加载屏放一个大的。珊瑚橙 = claude logo 本色，白底(头条)/黑底(加载屏)上都压得住。 */
  .k-logo{color:var(--claude); white-space:pre; line-height:1; margin:0;
     font-family:ui-monospace,Menlo,Consolas,monospace; user-select:none}
  .modal-h .k-logo{font-size:7px; flex:0 0 auto}
  /* 2026-10-13 owner：session 列表每行名字前缀一个同款小 logo（珊瑚身份标识，不是筛选位）。
     7px 和 pane 头条同尺寸，克制、不喧宾夺主。 */
  .k-h .k-logo{font-size:7px; flex:0 0 auto}
  /* pane 头上那两颗（刷新/关闭）：原来是带方框的文字按钮，夹在 logo 旁边不协调。
     改成安静的图标钮 —— 平时淡灰、无框无底，悬停才亮起一圈。刷新悬停时轻转一下
     暗示「重连」，关闭悬停转危险红。触屏上(见下面 @media)放大到好按。 */
  /* 图标是内联 SVG，不是 unicode 字形：⟳/✕ 这种字形自带的基线和字宽各字体不一样，
     font-size 既压不正中心也定不准视觉大小（owner 2026-10-12：「icon 很小而且不居中」）。
     SVG 用 viewBox 把尺寸和居中都钉死，再 stroke:currentColor 跟着 .ic 的 color 走，
     所以下面那两条 hover 换色对描边同样生效。 */
  /* 终端头上的两颗（重连/关闭）：幽灵图标钮 —— 无描边、无圆环，状态靠填充（抄 OpenCode）。 */
  .modal-h .ic{
    border:0; background:transparent; color:var(--dim);
    width:28px; height:28px; padding:0; border-radius:8px;
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .modal-h .ic svg{width:14px; height:14px; display:block; fill:none;
                   stroke:currentColor; stroke-width:2;
                   stroke-linecap:round; stroke-linejoin:round}
  .modal-h .ic:hover:not(:disabled){background:var(--ov-hover); color:var(--text)}
  .modal-h .ic.x:hover:not(:disabled){background:var(--bad-bg); color:var(--bad)}
  /* 额外按键条（Termux 式 extra-keys）：默认隐藏，只在手机 + 终端可写时出现（见 @media）。
     它是 modal-box 末尾的 in-flow 弹性子项 —— 终端 flex:1 自动缩出它的高度，不覆盖内容。
     顶上用柔和投影抬起（不是分隔线）。 */
  /* 底部留白按 iOS HIG：尊重设备安全区（home indicator / 圆角），但浏览器没报安全区时
     （env()=0）也兜一个最小基线，让按键永远不贴屏幕底边。左右同理（横屏刘海）。 */
  /* 撰写框：底部一簇（撰写框 + 额外键条）的最上面，柔和投影抬起（不是线）。
     左右吃安全区（横屏刘海）。原生输入框，输入法/语音/流式合成全交给系统。 */
  #compose{
    display:none; flex:0 0 auto; gap:8px; align-items:flex-end;
    padding:9px max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
    background:var(--panel); box-shadow:0 -8px 20px rgba(17,24,39,.07);
  }
  #compose-in{
    flex:1 1 auto; min-width:0; width:auto; resize:none; max-height:104px;
    border:0; border-radius:12px; background:var(--panel2); color:var(--text);
    font-size:16px; line-height:1.4; padding:9px 13px; font-family:inherit;  /* 16px：避开 iOS 聚焦自动放大 */
  }
  #compose-in:focus{outline:none; box-shadow:0 0 0 3px var(--line2)}
  #compose-in::placeholder{color:var(--faint)}
  #compose-send{
    flex:0 0 auto; width:40px; height:40px; border:0; border-radius:12px;
    background:var(--claude); color:#fff; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  #compose-send .ico{width:17px; height:17px; stroke-width:2.1}
  #compose-send:active{filter:brightness(.94)}
  #kbar{
    display:none; flex:0 0 auto; gap:6px; align-items:center;
    padding:8px max(10px, env(safe-area-inset-right, 0px))
            max(12px, env(safe-area-inset-bottom, 0px))
            max(10px, env(safe-area-inset-left, 0px));
    background:var(--panel);
    overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  #kbar::-webkit-scrollbar{height:0; width:0}
  .kb{
    flex:0 0 auto; min-width:38px; height:36px; padding:0 12px; border:0; border-radius:8px;
    background:var(--panel2); color:var(--text); cursor:pointer;
    font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-size:13px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; user-select:none;
    transition:background-color .1s ease, color .1s ease;
  }
  .kb:active{background:var(--line)}
  /* 黏住的 Ctrl：珊瑚实底（填充，不是描边/线） */
  .kb-mod[aria-pressed="true"]{background:var(--claude); color:#fff}
  /* 输入框开关：极简线条键盘（圆角框 + 一排键点 + 空格条），比文字键大一号；开着时同 Ctrl 一样珊瑚实底 */
  .kb-compose{padding:0 11px}
  .kb-compose[aria-pressed="true"]{background:var(--claude); color:#fff}
  .kb-ico{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2;
          stroke-linecap:round; stroke-linejoin:round}
  .kb-sep{flex:0 0 auto; width:10px}   /* 修饰键与方向键之间留一道空隙，不画线 */
  /* 键盘弹出时：按键条紧贴键盘顶，底部只留一丢丢（不再叠 home-indicator 安全区）。 */
  #c-pane-modal.kbd-up #kbar{padding-bottom:6px}
  /* 刷新「进行中」：图标持续转，直到首帧真内容落地（paneReveal）或 settle 才停。旋转这个
     强信号只留给真正的刷新动作（悬停不转，悬停只亮描边+底色）。转的是里面那枚 svg、
     绕它自己中心转，外面那圈描边不跟着转。 */
  .modal-h .ic.spin{color:var(--text)}
  .modal-h .ic.spin svg{animation:paneSpin .8s linear infinite; transform-origin:center}
  @keyframes paneSpin{from{transform:rotate(0)} to{transform:rotate(360deg)}}
  /* 盖着的时候别是一片死黑(刷新要重 attach ~2.6s，纯黑看起来像坏了；owner 2026-10-12)——
     放 claude 的方块 logo + 一句淡的「连接中…」。整层延迟 0.3s 才淡入：本地快开(几十毫秒就揭)
     时它根本不露面、保持单调，只有刷新这种真要等的才浮出来。absolute + pointer-events:none：
     不进盒子的量算(FitAddon 照常量)、也不挡选字。揭开(.sizing 撤)就 display:none。 */
  #c-pane-loading{display:none}
  #c-pane-term.on.sizing #c-pane-loading{position:absolute; inset:0; display:flex;
     flex-direction:column; align-items:center; justify-content:center; gap:18px;
     transform:translateY(-5%);  /* 视觉居中：数学正中会显得偏低，往上提一丝 */
     pointer-events:none; opacity:0; animation:paneSizingHint .2s ease .3s forwards}
  #c-pane-loading .k-logo{font-size:22px}
  /* 「连接中」这句是陪衬，不是主角：小字号 + 更淡的 --faint + 大字距 + 全大写，让它
     往后退、安静下来（原来 16px 太大、没有深邃感）。logo 才是视觉重心。 */
  #c-pane-loading .lbl{color:var(--faint); font-size:11px; font-weight:500;
     letter-spacing:.24em; text-transform:uppercase;
     font-family:ui-monospace,Menlo,Consolas,monospace}
  @keyframes paneSizingHint{to{opacity:1}}
  #c-pane-body.off{display:none}
  /* pane 弹窗铺满视口 —— owner 的选择是「铺满视口，像 jupyter」。
     改的只有 **#c-pane-modal 自己**，`.modal` / `.modal-box` 这两个基类一个字没动（铺满是
     #c-pane-modal 的覆写，不是改基类），所以别的用这套类的弹窗还是屏幕中间那张小卡片。
     少掉的三样东西都是卡片的壳：24px 的 scrim 内边距（390px 的手机上白吃 48px = 3-4 列）、
     14px 的圆角和那圈边框、投影。换来的是整块视口都是终端 —— 而且因为几何跟着盒子走
     （paneFitGeom 会把对面那个 window 调成盒子能摆下的格数），铺满之后多出来的空间变成的是
     **列数和行数**，不是四周的黑边。
     还剩的黑边只有「不到一整格」的那点余量（#c-pane-term.on 的居中把它平分到两边），以及
     对面调不动时的那种：只读目标 / resize 被拒的时候几何还是对面原来那个数，盒子大、终端小，
     居中 + overflow:auto —— 看得见的是一个完整的、能滚的终端，不是被切掉右边的终端。
     一条代价说清楚：铺满之后没有「弹窗外面那片灰」了，所以**点外面关窗这条路没了**。关窗
     剩两条：头上那颗「关闭」，和闸关着时的 Esc（闸开着时 Esc 要留给对面，见那条 keydown）。
     那个 click 监听没删 —— 它判的是 ev.target 就是遮罩本身，现在永远不成立，留着是为了
     「以后谁把 padding 加回来，这条路自己就活了」。 */
  /* 终端铺满顶栏以下的整块主区（从 --titlebar-h 往下到底）。顶栏因此一直露着、可切 Tab。
     用 top + bottom 锚定（不再 height:100dvh）：地址栏收放时底边仍贴视口，顶栏不被盖。 */
  #c-pane-modal{padding:0; top:var(--titlebar-h); height:auto}
  #c-pane-modal .modal-box{
    width:100%; height:100%; max-height:100%;
    border:0; border-radius:0; box-shadow:none;
  }
  /* 弹窗开着的时候整页不许滚（2026-10-12，owner：「把页面往下滑 会出现白边，然后开始输入
     文字之后 白边就没了 会这样抖动一下」）。两件事叠出来的那一下：
       ① 窄屏那条媒体查询把 `html,body` 放成 `height:auto; overflow:visible` —— 整页是能
          滚的。弹窗是 position:fixed 盖在视口上的，往下滑露出来的是它下面的页面底，而这块
          板子的 --bg 是浅色：那就是那条白边。
       ② 手机浏览器的地址栏一收，视觉视口变高，但 fixed 元素的包含块（布局视口）不跟着那
          一下走 —— 高度对不上的那一瞬屏上就是挪一下。一碰输入法/键盘又触发一次真的
          resize，于是「输入文字之后白边就没了」。
     ① 用这条锁死（fixed + inset 是为 iOS Safari：那边光 overflow:hidden 拦不住橡皮筋），
     ② 用上面那条 `height:100dvh`（dvh = 动态视口高度，地址栏收放它自己跟着变）。
     锁在 html 和 body 两层上：只锁一层的话另一层仍然是滚动容器。 */
  html.pane-open, body.pane-open{overflow:hidden; height:100%; position:fixed;
                                 inset:0; width:100%}
  /* 头条压薄一点：铺满之后它是唯一占着终端高度的东西，而它只需要放一个名字和两颗按钮。 */
  #c-pane-modal .modal-h{padding:8px 12px}
  /* 键盘直通：这块板子上在终端里按的每一个键都直接落到对面真终端里。
     ROUND9 第二轮把那颗按钮和那条「键盘：…」的字一起删了（owner：「下面那个派活、键盘、
     可打字 这些乱七八糟的东西 不知道是干啥的」），所以这里也不再有它的红框样式。
     「能不能打字」现在由终端自己说：可写的目标光标在眨（cursorBlink），不可写的是个
     死块（disableStdin 关着，onData 压根不触发）。规则一个字没变，只是不再用文字喊。 */

  .err{margin:12px 16px; padding:9px 12px; border:1px solid var(--bad-line);
       background:var(--bad-bg); color:var(--bad); border-radius:var(--r-sm); font-size:11px}
  /* 降级但不是坏掉：roster 拿不到实时数据、退回上一次成功的缓存时用这个。
     跟 .err 分开是因为两件事不一样 —— 红 = 什么都没有，黄 = 有，但是旧的。 */
  .err.cached{border-color:var(--busy-line); background:var(--busy-bg); color:var(--busy)}

  /* ── 窄屏（手机）──────────────────────────────────────
     在手机上打开看到的是桌面多列布局：这一页原来**一条 @media 都没有**，
     固定挡位（gate 430 / loop 352 / jobwrap 372 / footer 244）在 390px 宽的屏上必然
     横向溢出，而 body 是 overflow:hidden —— 溢出的那半不是滚出去，是看不见。
     这一段是**纯新增的覆盖**：上面每一条桌面规则的字面文本一个字都没改。逐字抄了本文件
     CSS 的那些断言因此都还落在原规则上（render-test 读的是剥了注释的样式表文本：
     `#c-pane-term.on{…overflow:hidden}`、`#c-pane-term .xterm{padding:…}` 那几条），
     而这一段里唯一盖掉桌面值的那条（手机上的 `.xterm` 内边距）自己也有断言盯着 ——
     它和桌面那条一样必须挂在**里面那层** .xterm 上，不许挂到宿主盒子上。
     断点取 860px（2026-10-12 从 640 提上来）：桌面那套 footer 三列加上下限和留白最少要
     848px（240+300+260 + 两道 gap + 左右 padding，见那几条下限上面的注释），比这个窄就
     一定有一列读不成。原来取 640 是「比任何一部手机的竖屏都宽」，但 641~860 这一段既不
     是手机也摆不下三列：实测 780px 宽时「事件时间线」那列被压到 2px、「RSI loop」那列的
     右边缘跑到 820，而 body 是 overflow:hidden —— 溢出的那半看不见也滚不到。
     横屏手机（844×390）现在走这一套：它的宽度 844 < 848，三列**挤不下**（之前这里写着
     「那个宽度三列挤得下」，是错的，实测过了）。高度不够那件事仍然没做 —— 要做是另一个
     max-height 的断点，得先有人在横屏上看过。 */
  @media (max-width:860px){
    /* 桌面是「视口定高 + 每块自己内部滚」。手机上没有那么多高度可分：改成整页纵向滚，
       每块各带一个上限，块内仍然滚自己的。 */
    html,body{height:auto; min-height:100%}
    body{overflow:visible; -webkit-text-size-adjust:100%}
    .tab-pane.on{flex:0 0 auto}

    /* 顶栏：手机上保持单行不换行；品牌只留珊瑚 logo、版本 pill 收起，把横向空间让给 Tab 条，
       Tab/图标钮放大到好按的触控尺寸。 */
    header#titlebar{flex-wrap:nowrap; padding:0 8px; gap:3px}
    .brand{padding-right:6px; margin-right:1px}
    .brand-logo{font-size:10px}
    .brand-name{display:none}
    .verpill{display:none}
    .ktab{max-width:150px; height:34px}
    #tab-home, #tab-new{width:36px; height:34px}
    /* 撰写框 + 额外按键条只在手机 + 终端可写时出现 */
    #c-pane-modal.open.kbd.compose #compose{display:flex}   /* 点一下才出现,不常驻 */
    #c-pane-modal.open.kbd #kbar{display:flex}

    /* 元信息带：胶囊换行，不靠省略号。select.sw 的 max-width:min(300px,17vw) 在 390px
       上只剩 66px，正好是把一个长 session 名裁掉的宽度。 */
    .hslot{flex-wrap:wrap; row-gap:7px; gap:10px; padding:9px 12px; align-items:flex-start}
    .caps{flex:1 1 100%}
    select.sw{max-width:none}
    .pill{height:auto; min-height:26px; padding:3px 9px}
    .goal{flex:1 1 100%; flex-wrap:wrap; row-gap:6px}
    .goal-obj{flex:1 1 100%; white-space:normal; overflow:visible; text-overflow:clip}
    .stale{flex:1 1 100%; white-space:normal; overflow:visible}
    .tick{flex:1 1 100%; text-align:left}
    /* 多列横排 → 单列堆叠，固定 px 挡位 → 100%。这是本段的主干。
       2026-10-19：底部 footer 退役成右检视栏 .rsi-rail，窄屏它也落到 transcript 下方整宽竖排。 */
    main{flex-direction:column; padding:10px 10px 0}
    /* 总览页底部也按 HIG 留白：尊重安全区，没报安全区也兜一个基线，不贴屏幕底边。 */
    main.last{padding-bottom:max(12px, env(safe-area-inset-bottom, 0px))}
    .rsi-rail{flex:0 0 auto; width:100%; min-width:0}
    .run-wrap,.pane-col,.pane-col.skills,.pane-col.base,.pane-col.engine,.kwrap,.jobwrap{
      flex:0 0 auto; width:100%; min-width:0;
    }
    /* 堆起来之后每块都不再「分到」高度了（父容器高度是内容决定的），所以给每块的滚动区
       一个 65vh 的上限：否则一块 300 行的 transcript 会把下面的块整个推出屏幕，而手机上
       没人知道下面还有东西。 */
    .run-wrap>.scroll,.pane-col>.scroll,.kwrap>.scroll,.jobwrap>.scroll{max-height:65vh}
    .ttl{padding:10px 12px; flex-wrap:wrap; row-gap:6px}
    .empty{padding:30px 14px}
    .empty .why{max-width:100%}
    /* 事件行的四格（时间 | 种类 | 标签 | 详情）换行，详情自己占一行且不裁：手机上
       一行能放 30 个汉字，省略号之后那条事件等于没显示。 */
    .ev{flex-wrap:wrap; row-gap:2px; padding:5px 12px}
    .ev .l{max-width:100%}
    .ev .d{flex:1 1 100%; white-space:normal; overflow:visible; text-overflow:clip}
    .diag{padding:9px 12px}
    .vd,.lp{padding:11px 12px}
    /* kore sessions 列表：名字 + 徽章换行（徽章的 margin-left:auto 在换行后会把它推到
       第二行最右边，去掉）。行上已无操作按钮——写操作都在终端里，所以这里只收窄内边距。 */
    .k-row{padding:11px 12px}
    .k-h{flex-wrap:wrap; row-gap:5px}
    .k-tag{margin-left:0}
    .form{padding:11px 12px}
    .jobs{padding:8px 12px}
    .job{flex-wrap:wrap; row-gap:2px}
    .job .msg{flex:1 1 100%; white-space:normal; overflow:visible; text-overflow:clip}
    /* pane 弹窗。宽度本来就是 min(1100px,100%)，所以手机上不是「1100 固定宽」溢出，
       而是 scrim 的 24px padding 在 390px 上白吃掉 48px —— 字号现在是固定的（13px 默认），
       所以这 48px 不再换成字号，而是直接换成**列数**：对面的 window 跟着盒子变
       （paneFitGeom），少 48px 就少 3-4 列。手机上列数本来就紧，所以这条规则更要紧了。
       `align-items` 保持基规则的 center（**没有**改成 stretch）：手机是「高度富余、宽度
       拮据」，盒子一撑满高度，24 行的终端就只占中间 216px，上下各一片 240px 的黑 ——
       实测过一次，图在 ref/mobile/ 的第一版里。高度留给内容决定，盒子贴着终端收口。
       这一段是 `.modal` 基类的手机规则**整段保留**，当共享弹窗壳的兜底：pane 自己走上面那条
       `#c-pane-modal` 的 ID 规则（铺满视口，padding 0、无圆角、height:100%），ID 的特异性比
       这里的类选择器高，和谁先谁后无关。上面那段「24px 换成 3-4 列」的账在手机上变成了
       「5px 也不吃了」，方向没变，只是更彻底。
       那条「盒子撑满高度就上下各一片黑」的实测结论没有过期，但它的前提是**几何不跟着盒子
       变**：现在 paneFitGeom 会把对面那个 window 的行数调成盒子能摆下的行数，所以撑满高度
       换来的是行数，不是黑边。前提不成立的那两种情形（只读目标、resize 被拒）黑边会回来，
       那时候它是诚实的 —— 对面就是那么大，而字号是人定的。 */
    .modal{padding:5px}
    .modal-box{width:100%; max-height:100%; border-radius:10px}
    .modal-h{padding:10px 12px; flex-wrap:wrap; row-gap:7px}
    .modal-b{padding:11px 12px}
    /* 头上那两颗图标钮（刷新 / 关闭）在触屏上放大到 36px，手指好按（桌面是 24px）。
       .modal-h 本来就允许换行（flex-wrap:wrap），挤不下会掉到第二行。
       底下那一排（派活框 / 派活 / Esc / 键盘）ROUND9 第二轮整排删掉了，所以 .modal-f
       的两条手机规则也跟着删了 —— 页面上已经没有这个类的用户。 */
    .modal-h .ic{width:36px; height:36px}
    .modal-h .ic svg{width:18px; height:18px}
    /* 终端宿主的左右 padding 从 18px 压到 4px。100 列的屏在 390px 宽上每列只有 3.6px，
       省下来的那 14px 就是一档字号。上面那条 #c-pane-term.on 一个字没动（align-items /
       justify-content 的居中仍然在它身上，两处断言抄的就是那一行）。
       和桌面那条一样挂在里面那层 .xterm 上：挂在 #c-pane-term 上会被 fit 的量盒子算成
       可用空间，手机上多出来的 6px 一样会长出外面那条滚动条。 */
    #c-pane-term .xterm{padding:3px 2px 0}
  }
</style>
</head>

<!-- ══ 脚本：三个 data-zone 块 ════════════════════════════════════════════════
     「哪段代码能写什么」是文件结构、不是注释约定：每个域块只打自己那一族门。
       shared —— 共用小工具 + 唯一的读客户端 apiGet（单参、无 method/body）。全是
                 const/function，一个 let/var 都没有 —— 没有跨块共享可变状态。
       kore   —— kore session 面板。唯一的写客户端 kPost()，恰 1 处 `method:'POST'`，
                 只打 /api/kore/ 这一族。
       shell  —— 起轮询。不渲染面板数据，零 `fetch(`、零 `method:`。 -->
<script data-zone="shared">
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Some session ids are literally `session-<uuid>` (the deepseek-harness ones),
   so a blind slice(0,8) renders two of them as the identical string `session-`. */
const shortId = id => String(id || '').replace(/^session-/, '').slice(0, 8);
const ago = ts => {
  if (!ts) return '';
  const d = Math.max(0, Date.now()/1000 - ts);
  if (d < 60) return Math.floor(d) + 's前';
  if (d < 3600) return Math.floor(d/60) + 'm前';
  if (d < 86400) return Math.floor(d/3600) + 'h前';
  return Math.floor(d/86400) + 'd前';
};

/* 2026-09-23: server now requires a token. Take it from ?token=… (the URL you
   open the dashboard with) and reuse it for every poll.
   2026-10-12: the token stays IN the URL — it is NOT stripped from the address bar.
   History: it used to be wiped with replaceState so a shared screenshot would not
   leak it; but that meant Cmd-R reloaded a token-less URL and the page came back
   unauthorized (a refresh dropped the token and the page showed unauth). The call: this
   token is allowed to leak, so the fix is the
   simplest one — leave it in the bar. A reload reloads the same URL, token and all,
   so it is never lost. No replaceState, no sessionStorage copy: one source of truth,
   the URL. (The whole fence is still the token + Bearer + confirm on writes; see
   service-8197.sh — nothing about write safety changed here.) */
const TOKEN = new URLSearchParams(location.search).get('token') || '';

/* 唯一的读客户端。一个参数，没有 opts —— 调用方没有任何办法从这里发出一个非 GET
   的请求：没有 method、没有 body、没有 Content-Type。ROUND7 之前这里是
   `api(path, opts)`，观察侧只传一个参数、操控侧传一个带写动作的 opts；那种形状下
   「观察 Tab 不写」靠的是调用方的自觉。现在靠的是签名。
   写入走 control 块自己的 kPost()，那是全页唯一一处 fetch 带 method 的地方。 */
async function apiGet(path) {
  const r = await fetch(path, {
    cache: 'no-store',
    headers: TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {},
  });
  const d = await r.json().catch(() => ({ error: 'HTTP ' + r.status }));
  if (!r.ok) throw new Error(d.refused || d.error || ('HTTP ' + r.status));
  return d;
}


/* ── shared 块到此结束 ──────────────────────────────────────
   这一块是 `const`（几个小工具 + TOKEN）和 `function`（唯一的读客户端 apiGet）：
   一个 `let`/`var` 都没有，没有东西可以被一处改了另一处看见。 */
</script>

<script data-zone="kore">
'use strict';
/* ── kore sessions：kore 域的写入面（2026-10-19 域轴重构后它只写 /api/kore/，rsi 写门在 rsi 块）──
   Every write here POSTs to /api/kore/<verb> with a Bearer header and a `confirm`
   field naming its own target; the server hands back a job id and the work runs on
   a background thread. Nothing on this page ever waits for a remote agent to
   finish thinking — `kore_send` can legitimately take minutes.
   这些数据是集群全局的（roster），不带任何 rsi run 参数 —— kore 域和 rsi 域互不知道对方的选中态。 */
let kRows = [];
// The live session-name prefix, as reported by the backend (/api/kore/roster -> r.prefix,
// = KORE_BRIDGE_PREFIX). renderK refreshes it every roster tick; kPost uses it to build
// the write `confirm` string so it mirrors koreops.full_name() EXACTLY — never hardcoded.
// Defaults to the backend's own default so a write works even before the first roster.
let kPrefix = 'kore-';

/* ── 星标（取代注册表那种「精选子集」，owner 2026-10-13）──
   纯前端：持久化只有 localStorage 一个 key，不进任何服务端状态、不跨 Tab。稳定 id =
   node_ip + '/' + name（名字在集群里不保证唯一，带上节点才认得准）。kStarSet 是进程内
   真相来源，初值从 localStorage 读，存不住（隐私模式/满了）就退化成本次会话的内存态——
   星标照样点得动，只是刷新后不记得。 */
let kStarSet = (() => {
  try { return new Set(JSON.parse(localStorage.getItem('kore.stars') || '[]')); }
  catch (e) { return new Set(); }
})();
function kStarId(s) { return s.node_ip + '/' + s.name; }
function kToggleStar(s) {
  const id = kStarId(s);
  if (kStarSet.has(id)) kStarSet.delete(id); else kStarSet.add(id);
  try { localStorage.setItem('kore.stars', JSON.stringify([...kStarSet])); } catch (e) { /* 存不住就本次内存态 */ }
  kSortRows();
  kPaintList();
}
/* 星标优先，组内保持 roster 原顺序。Array.prototype.sort 从 ES2019 起保证稳定，所以同为
   「星标 / 非星标」的两行相对次序不变 —— 不另加决胜键。roster 顺序本身稳定，星标集合也稳定，
   所以每次 roster 刷新重排得到的是同一个序，kSel 指的那一行不会无故跳。 */
function kSortRows() {
  kRows.sort((a, b) => (kStarSet.has(kStarId(b)) ? 1 : 0) - (kStarSet.has(kStarId(a)) ? 1 : 0));
}

/* 列表行上的「杀」—— 页内两步确认，不靠 window.confirm。
   2026-10-13 owner：这环境把浏览器原生 confirm/alert 整个吞了（一点就直接返回「取消」，不弹窗），
   所以杀绝不能押在原生弹窗上。做法：第一次点某行的垃圾桶只「待命」，把那颗钮渲成红底白字
   「确认杀」，顶栏吐司条说一句，3 秒不点自动撤；第二次点同一行才真走 kWrite('stop') 那扇写门
   （Bearer + POST + confirm 串 + 码点/速率限，一个字没松）。待命只记 kStarId（稳定），所以 roster
   重排/重画都认得是哪一行、重画不丢待命；换点别行的垃圾桶就把待命移到那行。这颗双击 arm 本身就是
   防误触：单点一下只亮红待命，不会杀掉任何东西。反馈走 note() 的顶栏吐司条 —— 列表页没弹窗盖着，
   看得见（当初杀在 pane 头条「点了没反应」就是吐司条被整屏弹窗盖住了）。 */
let kKillArm = '';     // 当前待命要杀的那一行 kStarId；空串 = 没有任何行待命
let kKillArmT = 0;
function kKillDisarm() {
  if (!kKillArm) return;
  kKillArm = '';
  clearTimeout(kKillArmT);
  kPaintList();        // 把那颗钮从红「确认杀」还原成静息垃圾桶
}
async function kKillClick(s) {
  const id = kStarId(s);
  if (kKillArm !== id) {                 // 第一次（或换了一行）：只待命，不杀
    kKillArm = id;
    clearTimeout(kKillArmT);
    kKillArmT = setTimeout(kKillDisarm, 3000);
    kPaintList();                        // 那颗钮据 kKillArm 渲成红「确认杀」
    note(`再点一次红色「确认杀」= 真杀 ${s.name}（kill 整个 tmux，未存对话没掉，不可撤）；3 秒不点自动撤`, true);
    return;
  }
  kKillArm = '';                         // 第二次点同一行：解除待命，真杀
  clearTimeout(kKillArmT);
  kPaintList();
  await kWrite('stop', s, {});           // 成功/被拒都由 kWrite 自己 note（列表页顶栏吐司条看得见）
}

/* 全页唯一一处带 method 的 fetch。没有走 apiGet —— apiGet 只有一个参数，根本接不住
   method/body；这是故意的，写入必须是一处显式的、grep 得到的例外，而不是读客户端的
   一个可选参数。两条硬要求都在这里：Bearer 头（不是 ?token=，URL 里的写 token 会进
   浏览器历史和反代日志），以及一条点名自己目标的 confirm 串。 */
function kPost(verb, body, opts) {
  // Mirror koreops.full_name(): prefix the name iff it isn't already prefixed. The prefix is
  // the live one (kPrefix, from the roster) — NOT a hardcoded 'kore-', or every write
  // breaks the moment KORE_BRIDGE_PREFIX differs (confirm != server's want -> 400).
  const fullName = body.name.startsWith(kPrefix) ? body.name : kPrefix + body.name;
  const confirm = `${verb}:${body.node_ip}:${fullName}`;
  return fetch('/api/kore/' + verb, {
    method: 'POST',
    cache: 'no-store',
    // keepalive 只给卸载路径用（见 paneGeomRestore / pagehide）：页面正在走人时，普通 fetch
    // 会被浏览器掐掉，keepalive 的让它发完。Bearer 头照常随 fetch 带（sendBeacon 带不了，所以
    // 还几何这一下不能用 beacon）。body 极小，远低于 keepalive 的 64KB 上限。
    ...(opts && opts.keepalive ? { keepalive: true } : {}),
    headers: { 'Content-Type': 'application/json',
               ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) },
    body: JSON.stringify({ ...body, confirm }),
  }).then(async r => {
    const d = await r.json().catch(() => ({ error: 'HTTP ' + r.status }));
    if (!r.ok) throw new Error(d.refused || d.error || ('HTTP ' + r.status));
    return d;
  });
}
function note(msg, bad) {
  // Notes live in their own span: the 5s clock refresh must not wipe a refusal
  // reason before it has been read. Errors linger 4x longer than confirmations.
  const el = $('c-note');
  el.textContent = msg ? ' · ' + msg : '';
  el.style.color = bad ? 'var(--bad)' : 'var(--text)';
  const mine = (note.seq = (note.seq || 0) + 1);
  setTimeout(() => { if (note.seq === mine) el.textContent = ''; }, bad ? 20000 : 5000);
}

function renderK(r) {
  kRows = r.sessions || [];
  kSortRows();   // 星标置顶（稳定排序，见 kSortRows）—— 在算 kSel/画表之前就把顺序定下来
  // ROUND7-FIX #2：这里原来还会 publishClusterFacts() 一次，把集群事实推给观察半边的
  // 本块（操控侧的集群 roster 视图）对观察半边**零输出** —— 两个 Tab 之间没有任何共享
  // 可变状态，各自独立拉数据，谁坏了都不牵连另一边。（观察侧那块曾消费集群事实的「本轮
  // 扇出」面板已于 2026-10-14 整块删除。）
  // `stale` = 读节点的子进程死了/超时了，服务端退回上一次成功的 roster。
  // 这种情况下 ok 是 false 但 sessions 不是空的 —— 如果不说，这些行看起来就跟实时的
  // 一模一样，那是页面在对读者说假话。所以 stale 必须自己开口。
  const stale = r.stale === true;
  const age = Math.round(r.stale_age_s || 0);
  const ageTxt = age >= 60 ? `${Math.floor(age / 60)} 分 ${age % 60} 秒` : `${age} 秒`;
  // 2026-10-12：只认全集群了（注册表模式砍掉），模式标签没意义，只留计数；server 退回上一次
  // 成功 roster 的那种 stale 自带年龄（stale_age_s），直接说出来。
  // 2026-10-13：另一种「旧」——操控区正常命中缓存、ok 的 roster，也会在屏上一直变旧，因为这边
  // 不轮询 roster（只在加载/手动刷新/写后刷新三处拉）。那种年龄不靠 server 时钟（跨机器会偏），
  // 按「本地收到这批的时刻」锚（kShownAt），由 kAgeTick 过线后追加「N 秒前的状态」并把点变淡。
  kShownAt = Date.now();
  kStaleFallback = stale;   // server-fallback 那种 stale 自己有年龄文案，不再叠加本地年龄
  kHeadBase = `${kRows.length} 个` + (stale ? ` · ${ageTxt}前的缓存` : '');
  kAgeTick();
  // 顶部「节点」胶囊。集群取不到时它自己说出来（约束 2：集群挂了也要能渲染，
  // 不许白屏），连不上的节点数单独挂出来而不是混进总数。
  const cap = $('c-node'), nodeN = (r.nodes || []).length, un = (r.unreachable_nodes || []).length;
  $('c-node-v').textContent = stale ? `${nodeN} · 缓存`
    : (r.ok === false ? '取不到' : (nodeN + (un ? ` · ${un} 连不上` : '')));
  cap.className = 'pill' + (stale ? ' warn' : (r.ok === false ? ' err' : (un ? ' warn' : '')));
  cap.title = stale
    ? `节点现在问不到（${r.error || '未知原因'}），这里显示的是 ${ageTxt}前最后一次成功的结果。`
      + `看板进程没事；恢复后自动回到实时。`
    : r.ok === false
    ? `列取节点失败：${r.error || '未知原因'}。本页其余部分照常渲染。`
    : `koreops 报的可路由节点数（/api/kore/roster，roster 读缓存+手动刷新，和名单年龄的 10s 轮询分开）` +
      (un ? `。连不上：${(r.unreachable_nodes || []).join(', ')}` : '');
  const warn = [];
  if (stale) warn.push(`⏳ 下面这些行是 <b>${ageTxt}前的缓存</b>，不是现在的状态`
    + `（读节点的子进程挂了：${esc(r.error || '未知原因')}）。`
    + `session 可能已经不在了 —— 写操作服务端会重新核一遍存活再下手。`);
  else if (!r.ok) warn.push(`列取失败：${esc(r.error || '未知原因')}`);
  if ((r.unreachable_nodes || []).length)
    warn.push(`连不上（agent 没响应）：${esc(r.unreachable_nodes.join(', '))}`);
  // 2026-10-12：名字不合规矩的 session 被服务端在边界上丢掉了（koreops._roster_keep：名字
  // 是从远端 tmux ls 里切出来的，不是我们起的）。丢掉可以，不说不行 —— 不然屏上少一行，
  // 而少的那一行看起来和「这个 session 已经没了」一模一样。
  if (r.skipped_name_count)
    warn.push(`有 ${r.skipped_name_count} 个 session 的名字不合规矩，没列出来`
      + `（只认字母数字和 - _，最长 48）：${esc((r.skipped_names || []).join(', '))}`);
  // 提示条和空列表说明存起来：键盘换高亮时要重画这一个 box，重画必须把它们原样带回来，
  // 否则「按一下↓，缓存警告就没了」—— 那是页面趁用户按键把话收回去。
  kHint = warn.length ? `<div class="err${stale ? ' cached' : ''}">${warn.join('<br>')}</div>` : '';
  // Never a bare empty box: say which nodes were looked at and why nothing came back.
  // 前缀不写死：服务端在 /api/kore/roster 里带上 r.prefix（KORE_BRIDGE_PREFIX 的实际值），
  // 没带到就退回默认的 kore-。表单提示和空列表说明都用它。
  kPrefix = r.prefix || 'kore-';   // global: also feeds kPost's confirm string
  const pfxEl = $('c-f-prefix'); if (pfxEl) pfxEl.textContent = kPrefix;
  // 版本号：服务端在 /api/kore/roster 里带回 __version__（同 prefix 一处）。顶栏右侧 pill
  // 显示它，并写到 <html data-kore-version> 上做一个 OpenCode 式的根钩子（给断言/调试用）。
  if (r.version) {
    $('ver-pill').textContent = 'v' + r.version;
    document.documentElement.dataset.koreVersion = r.version;
  }
  kEmpty = `<div class="empty">没有 kore session<br><span style="font-size:11px">扫了全集群的存活节点，没有 ${esc(kPrefix)} 前缀的 session</span></div>`;
  kPaintList();
  renderTabs();   // 名字/前缀可能变了，让 Tab 上的标签跟着刷新
  const sel = $('c-f-node');
  const live = (r.nodes || []).map(n => n.node_ip);
  if (sel.dataset.filled !== live.join(',')) {
    sel.dataset.filled = live.join(',');
    sel.innerHTML = (r.nodes || []).map(n =>
      `<option value="${esc(n.node_ip)}">${esc(n.node_ip)}${n.job_name ? ' · ' + esc(n.job_name) : ''}${n.gpus ? ' · ' + n.gpus + 'GPU' : ''}</option>`).join('');
  }
}

/* ── 会话 Tab 模型（OpenCode 式顶栏多 Tab）──
   「打开的会话」是一组轻量引用 openTabs（只存 {node_ip,name}）；真正的终端只有一个
   实例（paneTerm / paneStream，见下面 pane 那段）。切到某个 session Tab = openPane(s)
   把那唯一的终端重指到它（openPane 内部先 paneUnsubscribe 再重订，天然就是「重指」）。
   activeKey：'home' 或 session 的 node_ip/name（和 kStarId 同形）。 */
let openTabs = [];      // [{node_ip, name}]，顶栏上打开着的会话
let activeKey = 'home'; // 当前活动 Tab；'home' = 总览名单
function tabKey(s) { return s.node_ip + '/' + s.name; }   // 和 kStarId 同形
function kStripPrefix(name) { return name.startsWith(kPrefix) ? name.slice(kPrefix.length) : name; }
function tabFindRow(key) {
  // 优先用实时 roster 行（带 writable/state 等），退回 Tab 自己存的那份最小引用。
  return kRows.find(s => tabKey(s) === key) || openTabs.find(s => tabKey(s) === key) || null;
}
function renderTabs() {
  const list = $('tablist');
  if (list) list.innerHTML = openTabs.map(s => {
    const key = tabKey(s), label = kStripPrefix(s.name);
    const av = (label.slice(0, 1) || '·');
    return `<div class="ktab" role="tab" data-key="${esc(key)}" data-active="${key === activeKey}" title="${esc(s.name)} @ ${esc(s.node_ip)}">
      <span class="ktab-av" aria-hidden="true">${esc(av)}</span>
      <span class="ktab-t">${esc(label)}</span>
      <button class="ktab-x" data-act="tabclose" data-key="${esc(key)}" title="关闭标签（不杀 session）" aria-label="关闭标签">×</button>
    </div>`;
  }).join('');
  const home = $('tab-home'); if (home) home.dataset.active = (activeKey === 'home');
}
function openTab(s) {
  if (!openTabs.some(t => tabKey(t) === tabKey(s)))
    openTabs.push({ node_ip: s.node_ip, name: s.name });
  activeKey = tabKey(s);
  renderTabs();
  openPane(s);   // 把那唯一的终端重指到这个 session（见 openPane）
}
function goHome() {
  // 回总览：若终端开着，走它那条统一的关闭路径（会把 activeKey 复位 + renderTabs）；
  // 否则直接复位。总览名单本来就在终端下面，关掉终端就露出来了。
  if ($('c-pane-modal').classList.contains('open')) { $('c-pane-close').click(); return; }
  activeKey = 'home';
  renderTabs();
}
function closeTab(key) {
  const idx = openTabs.findIndex(t => tabKey(t) === key);
  if (idx < 0) return;
  const wasActive = (activeKey === key);
  openTabs.splice(idx, 1);
  if (!wasActive) { renderTabs(); return; }
  // 关掉的是当前活动 Tab：跳到右邻，没有就左邻，再没有就回总览。
  const nxt = openTabs[idx] || openTabs[idx - 1];
  if (nxt) openTab(nxt); else goHome();
}
$('tab-home').onclick = goHome;
$('tab-new').onclick = () => { goHome(); $('c-form').classList.add('open'); $('c-f-name') && $('c-f-name').focus(); };
$('tablist').addEventListener('click', ev => {
  const x = ev.target.closest('button[data-act="tabclose"]');
  if (x) { ev.stopPropagation(); closeTab(x.dataset.key); return; }
  const tab = ev.target.closest('.ktab');
  if (!tab) return;
  const s = tabFindRow(tab.dataset.key);
  if (s) openTab(s);
});

/* ── 状态诚实化：这批 roster 在屏上躺了多久（2026-10-13）──
   操控区不轮询 roster，这批快照会一直变旧到下一次手动刷新/写后刷新。kAgeTick 把「躺了多久」
   说出来：过 SHOW 秒在计数后缀上「N 秒前的状态」，过 DIM 秒给 #c-list 挂 .stale-age（点变淡 +
   停 busy 呼吸光晕，见那两条 CSS）。纯本地、零网络：锚是 kShownAt（收到那刻），不减 server
   时钟。server-fallback 那种 stale 自带年龄文案（kHeadBase 里已经有），这里不再叠加。 */
let kShownAt = 0;            // 本地收到最近一批 roster 的时刻（Date.now）
let kStaleFallback = false;  // 这批是不是 server 退回上一次成功的那种 stale
let kHeadBase = '';          // renderK 定的计数基文案（含 server-fallback 年龄），重画带回来
const K_AGE_SHOW = 10, K_AGE_DIM = 30;   // 秒：>SHOW 说年龄，>DIM 变淡+停脉冲
function kAgeTick() {
  if (!kShownAt) return;
  const age = Math.round((Date.now() - kShownAt) / 1000);
  const show = !kStaleFallback && age >= K_AGE_SHOW;
  const ageTxt = age >= 60 ? `${Math.floor(age / 60)} 分 ${age % 60} 秒` : `${age} 秒`;
  $('c-n').textContent = kHeadBase + (show ? ` · ${ageTxt}前的状态` : '');
  $('c-list').classList.toggle('stale-age', !kStaleFallback && age >= K_AGE_DIM);
}

/* ── 单会话刷新：你刚盯完一个 session 退出来，那一行就该是最新的（2026-10-13 owner）──
   全列表要最新很贵（每节点 tmux ls + capture + is_busy，是砍掉自动重扫前那条 ~35s 的慢扫），
   所以不自动刷全表。但「你真动过的那一个」很便宜：/api/kore/read 走常驻 read-agent，一发
   capture-pane 就拿到此刻的 busy/idle（和 roster 同一个 is_busy 真相源），不是开 pane 那条
   冷 tap、也不碰集群。把成本钉在这一个会话上，就地把它那一行补成最新。全表要最新仍走刷新钮。
   只收不放：读失败就不动那一行（别拿一次失败当「它变 idle 了」）。不碰 kShownAt —— 其余行
   还是老样子旧，整屏「N 秒前」的锚不能因为单独核了一行就谎称全刷新了。 */
async function kRefreshOne(s) {
  if (!s) return;
  const id = kStarId(s);
  let r;
  try {
    r = await apiGet(`/api/kore/read?node_ip=${encodeURIComponent(s.node_ip)}&name=${encodeURIComponent(s.name)}`);
  } catch (e) { return; }                        // 读失败：那一行保持原样，不说假话
  if (!r || !r.state) return;
  const row = kRows.find(x => kStarId(x) === id);
  if (!row || row.state === r.state) return;      // 行没了 / 状态没变：不白重画
  row.state = r.state;
  kPaintList();
}

/* ── kore 列表的键盘上下选择（R7FIX-3 任务三）──
   像 claude-code 那样：↑/↓ 移高亮、Enter 开 pane、Esc 退。全部在操控 Tab 里，纯前端，
   不加依赖、不加构建步骤。
   `kSel` 是**本地 UI 态**：它不进任何跨 Tab 的结构（这一块对观察半边零输出，见上面
   renderK 的注释），也不进 kRows —— 高亮是「我现在看哪一行」，不是服务端事实。
   高亮靠重画这一个 box 实现，而不是去摸某一行的 DOM：列表本来就是整块 innerHTML 渲染
   的（10s 一次），再引入第二条「只改一行」的路径就会有两个真相来源，roster 一刷新就把
   高亮吃掉。重画时 aria-selected / .sel / aria-activedescendant 一起出，同一次赋值。 */
let kSel = -1;        // 高亮行号，-1 = 没有高亮
let kHint = '';       // 上一次 renderK 算出来的提示条（缓存/连不上），重画要带回来
let kEmpty = '';      // 空列表时的说明，同理

function kPaintList() {
  const box = $('c-list');
  if (kSel >= kRows.length) kSel = kRows.length - 1;   // roster 变短了，别指空
  if (!kRows.length) {
    kSel = -1;
    box.innerHTML = kEmpty;
  } else {
    box.innerHTML = kRows.map((s, i) => {
      const meta = [s.node_ip, s.job_name, s.gpus ? s.gpus + ' GPU' : '', s.cwd].filter(Boolean).join(' · ');
      const lock = s.protected ? `<span class="k-tag lock" title="${esc(s.write_block)}">受保护</span>`
        : (!s.writable ? `<span class="k-tag lock" title="${esc(s.write_block)}">不可写</span>` : '');
      const starred = kStarSet.has(kStarId(s));
      const star = `<button class="k-star${starred ? ' on' : ''}" data-act="star" data-i="${i}" aria-pressed="${starred}" title="${starred ? '取消星标' : '星标（置顶）'}" aria-label="星标"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.1 8.6 22.3 9.3 16.8 14.2 18.4 21.4 12 17.6 5.6 21.4 7.2 14.2 1.7 9.3 8.9 8.6"/></svg></button>`;
      // 待命态按稳定 id 渲染（见 kKillClick）：roster 重排/重画都认得是哪一行，重画不丢待命。
      const armed = kKillArm === kStarId(s);
      const kill = `<button class="k-kill${armed ? ' arm' : ''}" data-act="kill" data-i="${i}" title="${armed ? '再点一次 = 真杀；3 秒不点自动撤销' : '杀掉这个 session（kill 整个 tmux session，未保存的对话就没了）'}" aria-label="${armed ? '确认杀' : '杀掉 session'}">${armed ? '确认杀' : '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'}</button>`;
      return `<div class="k-row ${s.protected ? 'protected' : ''}${i === kSel ? ' sel' : ''}" role="option" id="c-row-${i}" aria-selected="${i === kSel}" tabindex="-1">
        <div class="k-h"><span class="dot ${esc(s.state)}"></span><pre class="k-logo" aria-hidden="true"> ▐▛███▜▌
▝▜█████▛▘
  ▘▘ ▝▝</pre>
          <span class="k-n" title="${esc(s.name)}">${esc(s.name)}</span>
          ${lock}<span class="k-tag">${esc(s.state)}</span>${star}${kill}</div>
        ${meta ? `<div class="k-m">${esc(meta)}</div>` : ''}
        ${s.role ? `<div class="k-m">${esc(s.role)}</div>` : ''}
        ${s.summary ? `<div class="k-s">${esc(s.summary)}</div>` : ''}
      </div>`;
    }).join('');
  }
  if (kHint) box.insertAdjacentHTML('afterbegin', kHint);
  // 屏幕阅读器那一半：listbox 指向当前 option 的 id。没有高亮就是空串，不是 'c-row--1'。
  box.setAttribute('aria-activedescendant', kSel >= 0 ? `c-row-${kSel}` : '');
}

function kKeyNav(ev) {
  /* 返回值 = 这一下按键有没有被列表吃掉，纯粹为了能被断言，页面本身不看它。
     第一条规矩：焦点在输入框里的时候一个键都不抢 —— 「派活」那个单行输入框就在
     pane 弹窗里，上下键在输入框里是移光标，抢了就是 bug。用 ev.target 而不是
     document.activeElement：前者是事件自己带的，后者在无头环境里根本不存在。 */
  const t = ev.target || {};
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'
      || t.isContentEditable) return false;
  const k = ev.key;
  if (k === 'ArrowDown' || k === 'ArrowUp') {
    if (!kRows.length) return false;
    if (ev.preventDefault) ev.preventDefault();     // 别让页面跟着滚
    // #c-list 和 document 两处都挂了这个 handler（见文件尾那条 document keydown）。焦点在
    // 列表里（含关 pane 后聚回的 c-row-i）时冒泡会让 document 那条再跑一次，一次按键走两行。
    // #c-list 离得近、先收到，吃掉就 stop，document 不再重复触发。
    if (ev.stopPropagation) ev.stopPropagation();
    const d = k === 'ArrowDown' ? 1 : -1;
    kSel = kSel < 0 ? (d > 0 ? 0 : kRows.length - 1)
      : Math.max(0, Math.min(kRows.length - 1, kSel + d));
    kPaintList();
    // 滚进视野。重画之后才取这一行 —— 上一个 DOM 已经没了。
    const row = $(`c-row-${kSel}`);
    if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
    return true;
  }
  if (k === 'Enter') {
    const s = kRows[kSel];
    if (!s) return false;
    if (ev.preventDefault) ev.preventDefault();
    if (ev.stopPropagation) ev.stopPropagation();    // 同上：别让 document 那条再开一次
    // 只读：和整行点击同一条路（整张卡就是打开会话 Tab 的入口），kWrite / kPost 一个都不碰。
    openTab(s);
    return true;
  }
  if (k === 'Escape') {
    // 两档：弹窗开着就不是我的事（关弹窗那条路归 #c-pane-close，见下面那个 document
    // 监听），弹窗没开才是「取消高亮」。
    if ($('c-pane-modal').classList.contains('open')) return false;
    if (kSel < 0) return false;
    if (ev.stopPropagation) ev.stopPropagation();    // 同上
    kSel = -1;
    kPaintList();
    return true;
  }
  return false;
}
$('c-list').addEventListener('keydown', kKeyNav);

/* ── pane modal ──
   R7FIX-3 任务二（C）：pane 的内容现在是 SSE 推过来的，不是点一下读一次。
   以前 refreshPane() 身上没有任何定时器 —— 不点「刷新」就是无限延迟，这是本轮最硬的
   那个 bug。现在开 pane = 订阅 /api/kore/stream，服务端 ~1s capture 一次，只把**变化的
   部分**推下来；关 pane = close()，连接一断服务端那条线程自己结束。

   帧只有一种形状：{from, lines, total, state}。`from` 是上一帧和这一帧的公共前缀行数，
   所以同一种形状同时覆盖三件事 —— 追加（from == 旧行数）、TUI 原地重绘（from ≈ 总行数
   - 屏高，只补那几十行）、全量重发（from == 0，清屏时）。客户端因此只有一条 splice
   逻辑要写对，而不是 full / append / tail 三种事件各一条。

   ROUND8 在上面加了第二条路：**真终端**。两条路，二选一，分界线是「xterm.js 挂上来了没有」：
     * 挂上了 → 订阅 mode=term。服务端推**带 ANSI 转义码**的帧（`full` 一次 + 之后每拍
       `rows`），喂给 xterm.js，看到的就是 claude-code 本体的 TUI：配色、框线、原地重绘、
       光标都是真的，不是把 ANSI 剥掉之后的影子。
     * 没挂上 → mode 不传，服务端还是上面那条 {from,lines,total,state} 的纯文本 diff，
       渲染进 <pre>。这条路不是摆设：vendor 文件 404、CSP 拦了注入的脚本、页面被单独存一份
       拿去看，都会落到它上面，而它是本轮之前唯一存在过的那条路（任务书验收线 D）。
   两条路共用同一个订阅函数、同一个 EventSource、同一套关闭/重连，不同的只有「监听哪个
   事件名」和「写进哪个元素」。

   ROUND10 在最前面插了第三条，并且把它做成了**默认**：真字节流（paneSubBytes，
   /api/kore/bytes）。分界线还是「xterm 挂上来了没有」，只是挂上来之后先试字节流，起不来才
   退到 mode=term 的抓屏帧上。所以现在三条路、一个入口（paneSubscribe）：
     bytes  → 对面 tmux 控制模式的字节，xterm 自己解析（1.5-2.0ms，实测）
     screen → 抓屏 + 行 diff 帧，同一个 xterm（1000ms/130ms 一拍）
     text   → 剥了 ANSI 的纯文本进 <pre>（没有 xterm 时，验收线 D）
   谁在哪条线上由 paneWire 记着，因为**按键那一侧要跟着分叉**：字节流上不猜本地回显、也
   不要回执里那一屏（省掉 settle + 抓屏，真板子实测 150ms → 10ms 一发）；抓屏那条路上两件
   都得做。写门一个字没松：仍然是 POST /api/kore/input + Bearer + confirm + 码点 hex +
   600/min，少掉的只有**回执里那一屏**，而且是客户端自己说「我有别的路看屏」才少的。 */
let paneTarget = null;
let paneStream = null;        // EventSource 句柄；null = 现在没有订阅
let paneLines = [];           // 降级路径已经收到的行，splice 的基准
let paneTerm = null;          // xterm.js 的 Terminal 实例；null = 还没有真终端
let paneFit = null;           // fit addon 实例；null = addon 没挂上（字号就不动）
let paneWebgl = null;         // WebGL 渲染器实例；null = 没挂上/上下文丢了（退回 DOM 渲染器）
let paneWheelAcc = 0;         // Ctrl+滚轮攒下来的 deltaY（像素）；过 60 才动一档字号
let paneTermLoad = null;      // 加载那一次的 Promise —— 289KB 只拉一次
let paneSeenAt = 0;           // 最后一帧的服务端时间戳，用来丢掉迟到的旧屏
/* 现在这个 pane 的内容是从哪条线上来的。三个值，互斥，由 paneSubscribe() 一处写：
     'bytes'  —— /api/kore/bytes：对面 tmux 控制模式的**真字节流**（ROUND10 的主路）。
     'screen' —— /api/kore/stream?mode=term：抓屏 + 行 diff，喂给同一个 xterm（降级路）。
     'text'   —— /api/kore/stream：剥了 ANSI 的纯文本，渲进 <pre>（没有 xterm 时的那条，
                 验收线 D）。
   为什么这个变量必须存在，而不是「有 xterm 就是字节流」：按键的那一侧要按线路分叉 ——
   字节流上**不猜本地回显、也不要回执里那一屏**（对面的字节 2ms 就回来了，实测），而抓屏
   那条路上两件都得做（服务端的行 diff 拿它自己上一拍作底，一个刚打进去的字在它眼里不算
   「变了」，不靠回执就永远补不上）。两条路的按键行为不一样，所以线路得有名字。 */
let paneWire = '';
let paneTapFresh = false;     // 字节流：第一帧真字节还没来，屏上那张 prime 是旧的
let paneKbd = false;          // 终端现在能不能打字。可写目标开 pane 就是 true（ROUND9）
let paneQueue = [];           // 攒着还没发出去的码点（一发在路上的时候继续打字就落这里）
let paneSending = false;      // 有一发 POST 在路上
let paneFitTimer = null;      // 贴合（窗口 resize / 改字号）的防抖句柄
let paneGeomAsked = '';       // 上一次朝对面要过的几何 'CxR'。去重用的是**要过的**，不是
                              // 对面给的 —— 对面给回另一个数的时候不能再追着要一次，那是
                              // 两个人抢同一个方向盘（阶段3 否掉 fitAddon.fit() 的同一条理由）
