/* 唯一的 force 重扫入口。平时 kTick 不带 force（命中 server 120s cluster 缓存，秒回），
   只有点这颗才带 force=1 真逐个扫存活节点。转圈挂在这颗上、只在这一下 —— 读缓存本来就快，
   不转。kTick 自己把网络错吞成 ok:false（renderK 会把失败说出来），所以这里不会抛，
   finally 保证转圈一定停。 */
$('c-refresh').onclick = async ev => {
  const b = ev.currentTarget;
  if (b.classList.contains('spin')) return;      // 正在重扫就别叠一发
  b.classList.add('spin'); b.disabled = true;
  note('重扫全集群…（坏节点各付一次 ~35s 超时）');
  try { await kTick(true); note('已刷新'); }
  finally { b.classList.remove('spin'); b.disabled = false; }
};
$('c-new').onclick = () => { $('c-joinp').classList.remove('open'); $('c-form').classList.toggle('open'); };
/* 添加机器面板。数据来自 GET /api/join（WB token 鉴权，和其他读一样）。 */
async function kJoinLoad() {
  const box = $('c-joinp-body');
  let d;
  try { d = await apiGet('/api/join'); }
  catch (e) { box.textContent = '取不到加入信息：' + e.message; return; }
  if (!d.enabled) {
    box.innerHTML = '<div class="join-note">这台 server 没有设置 agent token，不能接受其他机器加入。' +
      '用 <code>kore</code> 启动的 server 会自动生成；如果是手工起的，请设置 <code>KORE_AGENT_TOKEN</code> 后重启。</div>';
    return;
  }
  const row = (id, val) => `<div class="join-code"><input id="${id}" readonly value="${esc(val)}">` +
    `<button data-copy="${id}">复制</button></div>`;
  const cl = (d.clients || []).map(c => {
    const st = !c.online ? ['off', '离线'] : (c.reachable === false ? ['warn', '连不回'] : ['ok', '在线']);
    const why = !c.online ? `${c.last_seen_s}s 前最后一次心跳`
      : (c.reachable === false ? `server 连不上它的 agent：${c.reach_error}` : `${c.sessions} 个 session`);
    return `<div class="join-cl"><span class="st ${st[0]}">${st[1]}</span>` +
      `<span class="ip">${esc(c.node_ip)}</span><span class="why" title="${esc(why)}">${esc((c.hostname || '').split('.')[0])} · ${esc(why)}</span></div>`;
  }).join('');
  box.innerHTML =
    `<div class="join-step">① 在新机器上安装 kore（已经装过可以跳过）</div>${row('c-join-install', d.install)}` +
    `<div class="join-step">② 在新机器上执行，加入这台 server（后台运行）</div>${row('c-join-cmd', d.command)}` +
    `<div class="join-note">网络需要双向可达：新机器 → 本 server 的 <code>${esc(d.server)}</code>；` +
    `本 server → 新机器的 agent 端口（默认 <code>${d.agent_port}</code>）。<code>kore client</code> 会检查这两个方向并直接告诉你哪里不通。` +
    `约 ${d.ttl_s} 秒内新节点会出现在名单里。在新机器上停止：<code>kore down</code>。` +
    `<br>这条命令里带着 agent token，相当于新机器的接入密钥，只发给你信任的机器。</div>` +
    (cl ? `<div class="join-step">已加入的机器</div>${cl}` : '');
}
$('c-join').onclick = () => {
  $('c-form').classList.remove('open');
  const p = $('c-joinp');
  if (p.classList.toggle('open')) kJoinLoad();
};
$('c-joinp-close').onclick = () => $('c-joinp').classList.remove('open');
$('c-joinp').addEventListener('click', async ev => {
  const b = ev.target.closest('button[data-copy]'); if (!b) return;
  const inp = $(b.dataset.copy); if (!inp) return;
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(inp.value); ok = true; } }
  catch (e) { /* 走下面的回退 */ }
  if (!ok) {   // http:// 下没有 Clipboard API：选中再 execCommand，失败也至少把整行选中了
    inp.focus(); inp.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  }
  b.textContent = ok ? '已复制' : '已选中，按 Ctrl+C';
  setTimeout(() => { b.textContent = '复制'; }, 1600);
});
$('c-f-cancel').onclick = () => $('c-form').classList.remove('open');
$('c-f-go').onclick = async () => {
  const name = $('c-f-name').value.trim();
  if (!name) { note('起 session 需要一个名字', true); return; }
  $('c-f-go').disabled = true;
  try {
    await kPost('start', { node_ip: $('c-f-node').value, name,
                          cwd: $('c-f-cwd').value.trim() || '~', role: $('c-f-role').value.trim() });
    $('c-form').classList.remove('open');
    $('c-f-name').value = '';
    note(`已提交：起 ${kPrefix}${name}`);
    setTimeout(() => kTick(true), 3000);
  } catch (e) { note('被拒绝：' + e.message, true); }
  $('c-f-go').disabled = false;
};

/* 2026-10-19 域轴重构：原「RSI session 入口」整块（kLoopSlug/Validate/Start/Stop/Send、撰写框
   双模、chip 行、kLoopConvo 第二 transcript、起/停/发写门）已迁进 rsi 域脚本块（data-zone="rsi"）。
   这块现在只剩纯 kore 域 —— roster 列表交互、pane 弹窗、kPost(/api/kore/)。 */

$('c-list').addEventListener('click', async ev => {
  // 2026-10-13 owner：行上只挂两颗钮 —— 星标（置顶）和杀（两步确认，见 kKillClick）；打断/催
  // 这类终端里本就能做的不挂。点钮的两条在 data-act 里分流，点行其它任意处 → 开终端。
  const b = ev.target.closest('button[data-act]');
  if (b) {
    const s = kRows[+b.dataset.i];
    if (!s) return;
    if (b.dataset.act === 'star') kToggleStar(s);
    else if (b.dataset.act === 'kill') kKillClick(s);
    return;
  }
  // 整行点击 → 开终端（pane 是全功能终端，直接打字/按 Esc）。和 Enter 键同一条只读路径。
  // 开终端前先撤掉任何待命中的杀：换了焦点就不该还留着一颗红「确认杀」等人误点。
  kKillDisarm();
  const row = ev.target.closest('.k-row[id^="c-row-"]');
  if (!row) return;
  const s = kRows[+row.id.slice(6)];   // 'c-row-'.length === 6
  if (s) openTab(s);
});
async function kWrite(verb, s, params) {
  /* 打本看板自己所在的 session 多问一次。
     2026-10-13 owner 把名单每行上的写键整排撤了，现在 kWrite 只剩一个钩子点：pane 头条
     那颗「杀」（stop）。「起」走 kPost，它建的是一个还不存在的 session，自指不可能；pane
     里的按键和贴合几何也直接走 kPost（一次按键问一次「这是不是你自己」没有读者，而那条路
     的目标就是人正在看的这一屏，不存在「打错了谁」）。
     `s.is_self` 是服务端 roster 算的（koreops.self_session()，动态识别，认不出来就是 false），
     所以这里不猜。服务端的拒绝逻辑一个字没动：这只是多一次确认，不是多一道闸。 */
  // 返回「原因串」：空串 '' = 提交成功；非空 = 没提交（自指取消 / 服务端拒 / 网络）。
  // 2026-10-13：杀钮在整屏 pane 弹窗里，而 note() 写的 #c-note 吐司条在弹窗背后看不见
  //（owner 报「点了没反应」就是这个）。所以把结果如实回给调用方，让它在能看见的地方（弹窗内 /
  // 阻塞 alert）自己说，并据此决定关不关 pane。note() 仍照打，给将来不在弹窗里的调用方留着。
  if (s.is_self && !window.confirm(
      `${s.name} 就是本看板自己运行所在的 session。${verb} 打上去会动到你正在看的这块板子` +
      `（停会直接 kill 掉它）。确定继续？`)) {
    note(`已取消：${verb} 的目标是本看板自己所在的 session`, true);
    return '已取消：目标是本看板自己所在的 session';
  }
  try {
    const j = await kPost(verb, { node_ip: s.node_ip, name: s.name, ...params });
    note(`已提交 ${verb} ${s.name} · job ${String(j.id || '').slice(0, 8)}`);
    setTimeout(() => kTick(true), 2000);
    return '';
  } catch (e) { note(`${verb} 被拒绝：${e.message}`, true); return e.message || '被拒绝'; }
}

/* ── pane 弹窗的控件（全部可写，全部在操控 Tab 里）── */
/* 关 pane 的三条路径（按钮 / 点遮罩 / 全局 Esc）都汇到这一个 onclick，所以
   paneUnsubscribe() 只挂这一处就够了，不会有哪条路径悄悄留着连接不放。
   注意 showTab() 不关弹窗：切到观察 Tab 再切回来，订阅还活着、内容还在，这是对的，
   不是泄漏 —— 释放的触发条件是关弹窗，不是看不见。 */
$('c-pane-close').onclick = () => {
  const was = paneTarget;
  paneUnsubscribe();
  // 关闸要在清 paneTarget 之前：paneSetKbd() 要靠它判断可写性，顺序颠倒就会把闸留在
  // 开着的状态，下一次开 pane 的头一个微任务里按的键会直接落到新目标上。
  paneSetKbd(false);
  // 同理在清 paneTarget 之前：借来的几何要还给这个目标，而 paneGeomRestore 自己要点名它。
  paneGeomRestore();
  $('c-pane-modal').classList.remove('open');
  panePageLock(false);
  paneTarget = null;
  paneRestoreFocus(was);
  // 弹窗开着的这段时间操控侧轮询是停着的（它被整屏挡住了，画了没人看 —— 见 shell 区
  // 的 pollLive）。关的这一刻补一拍，但**不重扫集群**：roster 现在只在加载/手动刷新/写后
  // 刷（2026-10-12 owner 改成读缓存+手动刷新）；若这里 force 一发，关 pane 时缓存若已过
  // 120s 就会卡 ~35s，是个坏意外。所以只重画已有名单（带缓存年龄），要看最新集群点标题栏
  // 那颗刷新钮。
  kPaintList();
  // 关终端 = 回总览 Tab（该 session 的 Tab 仍留在条上，没被关掉；关 Tab 走那颗 ×）。
  activeKey = 'home';
  renderTabs();
  // 你刚盯完 was 这个 session，退出来它那一行就该是最新的 —— 单独问它一次（便宜，见 kRefreshOne）。
  // fire-and-forget：拿不到就保持原样，不卡关 pane 这条路。
  kRefreshOne(was);
};
// 刷新 / 关标签 / 跳走这条是**真走人**:把 window 交还给 tmux 并清掉借标志（paneGeomRestore）。
// 「切后台但人还在看」是另一条路,见下面 visibilitychange —— 那条临时让渡、留着 borrowed 回来再借。
// 两条分开:走人就该清干净,后台只是暂时让位。不松的后果:对面 window 被钉在贴浏览器盒子的
// 尺寸（window-size manual），别的 client / 别的设备 attach 进来都被钉住跟不了自己（2026-10-13
// 手机继承桌面宽度那次就是漏了这一松）。c-* 的 id 只有操控区能摸，所以这个监听挂在这儿，不在 shell。
addEventListener('pagehide', () => {
  if ($('c-pane-modal').classList.contains('open') && paneGeomBorrowed) {
    paneGeomRestore({ keepalive: true });
  }
});
/* 浏览器切前后台时的几何让渡，和 pagehide 同一套、同样留在操控区自己手里 —— c-* 的元素和
   paneGeom* 只有操控区能摸，shell 那边的 visibilitychange 只把「现在是前台还是后台」转进来
   （跟 kCovered 一个道理：判断留在这边，shell 只拿结果）。
   切后台（标签切走 / 手机锁屏回桌面）：把 window 交还给 tmux，但留着 paneGeomBorrowed —— 人还在
   看这个 pane，回前台再借一次。回前台：再贴合一次盒子。没开 pane 就与几何无关，直接不管。 */
/* 焦点让渡:模拟 tmux 3.1+ 的 `window-size latest`(谁在用,窗口就跟谁),不依赖 tmux 版本。
   网页失去焦点(切去自己的终端 / 别的窗口)就把 window 交还给 tmux,attach 着的终端立刻拿回
   自己的尺寸;回到网页再借,网页重新铺满。和 visibilitychange 同一套 release / 再借。 */
addEventListener('blur', () => { if (kCovered() && paneGeomBorrowed) paneGeomRelease(); });
addEventListener('focus', () => { if (kCovered()) paneFitGeom(0); });
function kVisibility(hidden) {
  if (!kCovered()) return;
  if (hidden) { if (paneGeomBorrowed) paneGeomRelease(); }
  else paneFitGeom(0);
}
/* 这一屏现在被挡着没有。给 shell 区那条轮询用：pane 弹窗是铺满视口的（ROUND10 的选择），
   开着的时候它后面的名单、派活区、作业表一个像素都看不见，那几拍重排是白画的。
   这个判断留在操控区自己手里，因为 c-* 的元素只有操控区能摸（「两个半边的 id 不许交叉」
   那三条结构断言）—— shell 只拿这个函数的返回值。 */
function kCovered() {
  return $('c-pane-modal').classList.contains('open');
}
/* 弹窗开着的时候把整页钉死（见 html.pane-open 那条 CSS）。
   两层都要挂：只挂一层的话另一层仍然是滚动容器，往下滑照样能把弹窗下面那片页面底露出来
   —— owner 看到的那条白边就是它。 */
function panePageLock(on) {
  document.documentElement.classList.toggle('pane-open', on);
  document.body.classList.toggle('pane-open', on);
}
/* 关掉弹窗之后，焦点要回到名单上这个 session 自己那一行。
   不还的话焦点掉回 body：用鼠标的人看不见这件事，只用键盘的人每次关完弹窗都要从头
   ↑↓ 找位置。
   为什么是「按身份重新查行」，而不是开 pane 的时候把那个按钮记下来：roster 每 10 秒
   用 innerHTML 整片重绘一次，记下来的那个 DOM 节点在弹窗开着的这段时间里几乎一定会被
   换掉 —— 阶段3 的真浏览器实测抓到的就是这个，document.contains() 判否，焦点一次也
   没还回去过。行的 id 带的是下标，下标会随名单增删而移位，所以用 name+node_ip 重新
   定位，而不是记下标。行上有 tabindex="-1"：能被代码 focus，但不进 Tab 序列。
   查不到（这个 session 期间消失了）就什么都不做：焦点留在 body 比跳到一行别人的活上好。*/
function paneRestoreFocus(s) {
  if (!s) return;
  const i = kRows.findIndex(r => r.name === s.name && r.node_ip === s.node_ip);
  const row = i >= 0 ? $(`c-row-${i}`) : null;
  if (row && row.focus) row.focus();
}
/* 窗口尺寸变了就重新贴合对面。防抖在 paneFitGeom 里（250ms）—— 拖窗口会连着发几十个
   resize 事件，而每一发贴合是一次真的写，所以这里的防抖不是省 CPU，是省写。
   只在弹窗开着的时候做：关着的时候宿主盒子高度是 0，量出来是「1 行」，会去要一个 20×5。 */
addEventListener('resize', () => {
  if ($('c-pane-modal').classList.contains('open')) paneFitGeom();
});

/* ── 移动端额外按键条（Termux 式 extra-keys）────────────────────────────
   软键盘打不出来的键（Esc / Tab / ⇧Tab / 方向 / Ctrl）：每颗把一段终端字节序列喂进和
   打字同一扇门（paneInput → POST /api/kore/input，Bearer+confirm 一个字没松）。
   Ctrl 是黏一次修饰键（改写见 paneInput 顶上）。参考 Termux 的 extra-keys row 设计。 */
const KBAR_SEQ = {
  esc: '\x1b', tab: '\t', stab: '\x1b[Z', 'c-c': '\x03',
  left: '\x1b[D', down: '\x1b[B', up: '\x1b[A', right: '\x1b[C',
};
let paneCtrl = false;      // 黏一次 Ctrl 是否点亮（见 paneInput / paneSetKbd）
function paneSetCtrl(on) {
  paneCtrl = !!on;
  const b = document.querySelector('#kbar button[data-k="ctrl"]');
  if (b) b.setAttribute('aria-pressed', paneCtrl ? 'true' : 'false');
}
// pointerdown 上 preventDefault：点按键条不抢走终端焦点，否则软键盘收起、还得再点终端。
$('kbar').addEventListener('pointerdown', ev => { if (ev.target.closest('button.kb')) ev.preventDefault(); });
$('kbar').addEventListener('click', ev => {
  const b = ev.target.closest('button.kb'); if (!b) return;
  const k = b.dataset.k;
  if (k === 'ctrl') { paneSetCtrl(!paneCtrl); return; }   // 黏一次：改写下一个键
  if (k === 'compose') { composeShow(!composeOn()); return; }
  const seq = KBAR_SEQ[k]; if (!seq) return;
  paneInput(seq);
  // 方向/Esc/Tab 之后：撰写框开着就把焦点还给它，别让软键盘收起；收着就不弹键盘
  // （手机）；桌面/平板还给终端。
  if (composeOn()) $('compose-in').focus();
  else if (paneTerm && !window.matchMedia('(max-width:860px)').matches) paneTerm.focus();
});

/* ── 移动端原生撰写框 ──────────────────────────────────────────────
   在真正的 <textarea> 里撰写：输入法、语音听写、流式「边说边改」全由浏览器原生处理，
   本地即时回显、零往返延迟。回车（非合成态、非 Shift）或发送钮 → 把整句经 paneInput
   送进对面并清空；空内容回车 = 单独一个回车（给菜单确认用）。 */
function composeOn() { return $('c-pane-modal').classList.contains('compose'); }
function composeShow(on) {
  const m = $('c-pane-modal'), ci = $('compose-in');
  if (!ci || on === composeOn()) { if (on && ci) ci.focus(); return; }
  m.classList.toggle('compose', on);
  const b = document.querySelector('#kbar button[data-k="compose"]');
  if (b) b.setAttribute('aria-pressed', on ? 'true' : 'false');
  if (on) { composeGrow(); ci.focus(); } else ci.blur();
  paneFitGeom();   // 底部那一簇变高/变矮，终端盒子跟着变，重新贴合对面
}
function composeGrow() {
  const ci = $('compose-in'); if (!ci) return;
  ci.style.height = 'auto';
  ci.style.height = Math.min(104, ci.scrollHeight) + 'px';
}
function composeSend() {
  const ci = $('compose-in'); if (!ci) return;
  paneInput(ci.value + '\r');     // 空串也发 = 裸回车
  ci.value = ''; composeGrow(); ci.focus();
}
$('compose-in').addEventListener('input', composeGrow);
$('compose-in').addEventListener('keydown', ev => {
  // 合成中（输入法/语音正在改写）的回车是「上屏确认」，不发送；只有非合成态回车才发送。
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); composeSend(); }
});
$('compose-send').addEventListener('click', ev => { ev.preventDefault(); composeSend(); });
// 点发送钮不许先抢走撰写框的焦点（否则下面的失焦收起会先把它藏掉）。
$('compose-send').addEventListener('pointerdown', ev => ev.preventDefault());
// 失焦且没写东西 ⇒ 收起；写了一半就留着，免得点一下别处把草稿藏起来。
$('compose-in').addEventListener('blur', () => {
  setTimeout(() => {
    const ci = $('compose-in');
    if (document.activeElement !== ci && !ci.value.trim()) composeShow(false);
  }, 150);
});
// 手机窄屏：点一下终端区域（不是拖动滚屏 —— click 只在轻点时触发）⇒ 撰写框出现。
$('c-pane-term').addEventListener('click', () => {
  if (PANE_IS_TOUCH && window.matchMedia('(max-width:860px)').matches
      && $('c-pane-modal').classList.contains('kbd')) composeShow(true);
});

/* 软键盘让位：手机软键盘弹出时 visualViewport 变矮。把终端弹窗底边抬到键盘顶上 ——
   末尾那条 in-flow 的 #kbar 就正好浮在键盘上方（和 Termux 的 extra-keys 一样在键盘上面），
   终端 flex:1 收缩、随后重新贴合对面几何。桌面没有软键盘，偏移恒为 0，无副作用。 */
function paneVVSync() {
  const vv = window.visualViewport, m = $('c-pane-modal');
  if (!vv || !m) return;
  const kb = Math.round(window.innerHeight - vv.height - vv.offsetTop);
  const up = kb > 40;                           // >40 才当作键盘，避开浏览器 UI 栏的小抖动
  m.style.bottom = (up ? kb : 0) + 'px';
  // 键盘弹出时按键条贴在键盘顶上：home-indicator 安全区被键盘盖住、无意义，底部那段
  // max(12px,safe-area) 留白要收掉，只留一丢丢（见 #c-pane-modal.kbd-up #kbar）。
  m.classList.toggle('kbd-up', up);
  if (m.classList.contains('open')) paneFitGeom();
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', paneVVSync);
  visualViewport.addEventListener('scroll', paneVVSync);
}

$('c-pane-refresh').onclick = refreshPane;
/* 字号没有按钮。owner 两次都是同一句话：「怎么还有个调字体大小的按钮」「做的跟 jupyter
   那样很难么」—— JupyterLab 的终端面板上也没有这种旋钮，字号是全局设置里的一个数，终端
   本身只管「盒子多大就铺多大」。所以这里字号是一个固定的 13，唯一的改法是 Ctrl+滚轮：
   一个不占界面的手势（VS Code 的终端、各家 term 都是它），档位记在 localStorage。
   passive:false + preventDefault 是必须的：不拦的话浏览器会把整页缩放掉（那会把弹窗、
   名单、所有东西一起放大，而人想放大的只有终端里的字）。不带 Ctrl 的滚轮一个字不碰 ——
   那是 xterm 自己的回看历史。
   2026-10-12：攒够一格才动一档。原来是「来一发 wheel 就 ±1」，而触摸板和带平滑滚动的
   鼠标一次手势会吐几十发 deltaY 只有 1~4 的小事件 —— 实际效果是字号从 13 一路飙到上下
   限，而且每一档都要重排整个终端 + 重新量盒子 + 给对面发一次 resize。所以把 deltaY 累起
   来，过了 60（Chrome 一个鼠标滚轮刻度是 100，触摸板一小段约 10~40）才走一档，走完扣掉。
   deltaMode 不是像素的要先换算成像素，不然 Firefox 的「3 行」会被当成 3 像素，永远攒不够。
   累加器是模块级的一个数、就地加减：render-test 有一条正则盯着这个处理器的形状
   （`if (!ev.ctrlKey) return;` 和 `ev.preventDefault();` 必须相邻、结尾必须是
   `{ passive: false });`），抽成函数会把那条断言变成空断言。 */
$('c-pane-term').addEventListener('wheel', ev => {
  if (!ev.ctrlKey) return;
  ev.preventDefault();
  const px = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaMode === 2 ? ev.deltaY * 400 : ev.deltaY;
  paneWheelAcc = (paneWheelAcc > 0) === (px > 0) ? paneWheelAcc + px : px;
  if (Math.abs(paneWheelAcc) < 60) return;
  paneWheelAcc = 0;
  paneSetFont(paneFontGet() + (px < 0 ? 1 : -1));
}, { passive: false });
$('c-pane-modal').addEventListener('click', ev => {
  if (ev.target === $('c-pane-modal')) $('c-pane-close').click();
});
/* 全局 Esc 关弹窗 —— 但键盘直通开着的时候不关。Esc 是对面最要紧的那个键
   （claude-code 的「esc to interrupt」就是它），闸开着还被这块板子截下来当「关窗」，
   等于把唯一一个能打断对面的键吞掉。闸开着时关窗只剩「关闭」那颗按钮 —— ROUND10 把 pane
   铺满了视口，「点弹窗外面那片灰」那条路没有了（那条监听留着，见 #c-pane-modal 的 CSS）。
   挂在 capture 相（第三个参数 true）是被真浏览器逼出来的，不是风格偏好：焦点在
   xterm 自己的 textarea 上时，xterm 的 _keyDown 对 Escape 走 cancel(e,true) ——
   那里面是 preventDefault() **加** stopPropagation()，冒泡相的 document 监听根本
   收不到。于是「闸关着按 Esc 关弹窗」在真浏览器里是哑的（阶段2 实测抓到的）。
   capture 相在 textarea 之前跑，所以这条判断自己说得准；这里不 preventDefault，
   闸关着时那一下继续往下走给 xterm 也无所谓 —— disableStdin 挡着，发不出去。 */
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('c-pane-modal').classList.contains('open') && !paneKbd) {
    $('c-pane-close').click();
  }
}, true);
/* 键盘导航的桥：#c-list 上已经挂了同一个 kKeyNav（焦点在列表里时走那条），这一条管
   「焦点还在 body 上」的常见情形 —— 刚切到操控 Tab，还没点过任何东西就想按↓。
   弹窗开着的时候整条桥让位：那时候该响应的是弹窗（上面那条 Esc、以及输入框自己的
   回车），列表在背后跟着动只会让人不知道自己在操作谁。逻辑一个字都不在这里，全在
   kKeyNav 里 —— 这条桥不可测（stub 的 document 只记不发），所以它必须没有逻辑。 */
document.addEventListener('keydown', ev => {
  if ($('c-pane-modal').classList.contains('open')) return;
  kKeyNav(ev);
});

/* kore polling is separate from /api/state: the roster has its own server-side TTL
   (120s cluster) and a cluster sweep costs ~35s per dead node, so it must never
   ride along on the 5s state poll. 2026-10-12 owner 又定：连 kore 侧的 10s 轮询都不
   自动重扫 roster 了，roster 读缓存，重扫走手动刷新钮。
   roster 请求不带任何 rsi run 参数 —— kore 域和 rsi 域互不知道对方的选中态。
   2026-10-19 域轴重构：RSI 对话轮询（原 kLoopRuns）已随写模块迁去 rsi 域（那边一发合并
   tick 读 runs+trace+base）；这里只剩 roster（kTick，固定 scan=cluster、读 120s 缓存，
   只有刷新钮带 force 真重扫）+ 名单行年龄刷新（kAgeTick）。冷缓存首帧仍要付一次 ~35s，
   那是 startup 的 kTick() 这一发。 */
let kBusy = false;
async function kTick(force) {
  if (kBusy) return;
  kBusy = true;
  try {
    const r = await apiGet(`/api/kore/roster?scan=cluster${force ? '&force=1' : ''}`)
      .catch(e => ({ ok: false, error: e.message, sessions: [] }));
    renderK(r);
  } finally { kBusy = false; }
}
</script>

<script data-zone="shell">
'use strict';
/* 单屏（kore session）：没有 Tab 切换 —— rsi 域已拆出本包，这屏只剩 kore 名单 + 终端。
   一条可见态轮询（kore 10s）：只在本屏真被看、且没被终端弹窗挡住时刷名单行年龄。切走/切回
   的脏标记保留下来，露面立刻补一拍，所以「看到的不比它露面那刻旧」照旧成立。 */
const pollStale = { kore: false };
function pollLive(which, covered) {
  const live = !document.hidden && !covered;
  if (!live) pollStale[which] = true;
  return live;
}
function pollWake(which) {
  if (!pollStale[which] || document.hidden) return;
  pollStale[which] = false;
  // 露面补一拍，但不重扫集群（roster 读缓存+手动刷新，别在切回来那刻冷缓存卡 ~35s）。
  kPaintList(); kAgeTick();
}
kTick();
// kore 侧 10s 只刷名单行年龄（kAgeTick），**不自动重扫 roster**（全集群结果缓存住，读
// 缓存+手动刷新钮）。roster 只在加载/手动刷新/写后刷新三处真拉。
setInterval(() => { if (pollLive('kore', kCovered())) { kAgeTick(); } }, 10000);
document.addEventListener('visibilitychange', () => {
  // 几何让渡交给 kore 区的 kVisibility（c-* 元素和 paneGeom* 只那边能摸）。
  kVisibility(document.hidden);
  if (document.hidden) return;
  pollWake('kore');  // 回到前台把落下的补上（后台 Tab 被浏览器把 setInterval 掐到 ~1min）。
});
</script>
</body>
