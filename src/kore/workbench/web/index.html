<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>kore</title>
    <!-- Apply theme before first paint (no light flash), same contract as the old board:
         localStorage 'kore.theme' = light | dark | auto. -->
    <script>
      try {
        var t = localStorage.getItem('kore.theme') || 'auto'
        if (t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
